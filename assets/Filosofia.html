<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Plan de Correlatividades - Profesorado de Filosofía</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        
        .regimen-divider {
            display: flex;
            align-items: center;
            margin: 1.25rem 0 0.5rem 0;
            color: #94a3b8;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .regimen-divider::before, .regimen-divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px dashed #cbd5e1;
        }
        .regimen-divider span { margin: 0 10px; }
        
        /* Scrollbars personalizados */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

<body class="p-4 lg:p-8 text-slate-800 h-screen flex flex-col overflow-hidden">

<div id="cascadaApp" class="w-full max-w-[1800px] mx-auto flex flex-col h-full space-y-4">

    <!-- Header -->
    <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 flex-shrink-0">
        <div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Profesorado de Filosofía <span class="text-slate-400 font-normal">| Res. 4793/15</span></h2>
            <p class="mt-1 text-sm text-slate-500 font-medium">
                Mapa interactivo. <span class="text-blue-600 font-bold">Clic en una materia</span> para ver detalles.
            </p>
        </div>
        
        <div class="flex flex-col items-end gap-2">
            <!-- Leyenda de Tipos (Campos de Formación) -->
            <div class="flex flex-wrap gap-2 text-[10px] font-bold uppercase justify-end opacity-80">
                <span class="px-2 py-1 rounded border bg-[#eff6ff] text-[#1d4ed8] border-[#bfdbfe]">Formación General</span>
                <span class="px-2 py-1 rounded border bg-[#ecfdf5] text-[#047857] border-[#a7f3d0]">Formación Específica</span>
                <span class="px-2 py-1 rounded border bg-[#faf5ff] text-[#7e22ce] border-[#d8b4fe]">Práctica Profesional</span>
            </div>
            <!-- Leyenda de Formatos -->
            <div class="flex flex-wrap gap-2 text-[10px] uppercase justify-end">
                <span class="px-2 py-0.5 rounded border bg-white text-slate-600 border-slate-200 font-bold">Asignatura</span>
                <span class="px-2 py-0.5 rounded border bg-[#fffbeb] text-[#b45309] border-[#fcd34d] font-bold">Taller</span>
                <span class="px-2 py-0.5 rounded border bg-[#ecfccb] text-[#3f6212] border-[#bef264] font-bold">Seminario</span>
            </div>
        </div>
    </div>

    <!-- Controles -->
    <div class="bg-white p-3 rounded-2xl border border-gray-200 shadow-sm z-30 flex-shrink-0">
        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div class="relative flex-1 w-full sm:max-w-xs">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Buscar materia..." class="pl-9 w-full rounded-xl border-gray-200 bg-slate-50 p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
            </div>

            <div class="flex gap-2 w-full sm:w-auto">
                <!-- Filtro por Formato -->
                <select id="filterFormato" class="flex-1 sm:flex-none rounded-xl border border-gray-200 px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-100 outline-none">
                    <option value="">Todos los Formatos</option>
                    <option value="Asignatura">Asignaturas</option>
                    <option value="Taller">Talleres</option>
                    <option value="Seminario">Seminarios</option>
                    <option value="Variable">UDI / Variable</option>
                </select>
                <!-- Filtro por Tipo -->
                <select id="filterTipo" class="flex-1 sm:flex-none rounded-xl border border-gray-200 px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-100 outline-none">
                    <option value="">Todos los Campos</option>
                    <option value="Formación General">Formación General</option>
                    <option value="Formación Específica">Formación Específica</option>
                    <option value="Práctica Profesional">Práctica Profesional</option>
                </select>
                <button id="resetBtn" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-bold transition-colors">Limpiar</button>
            </div>
        </div>
    </div>

    <!-- Grid Principal (Scroll Horizontal Puro) -->
    <div class="flex-1 overflow-x-auto overflow-y-hidden pb-2">
        <div id="mainGrid" class="flex flex-nowrap gap-5 h-full px-1">
            <!-- Las columnas se generan aquí dinámicamente -->
        </div>
    </div>

    <!-- Panel de Detalles -->
    <div id="detailPanel" class="fixed inset-x-0 bottom-0 z-50 transform translate-y-full transition-transform duration-300 ease-in-out pointer-events-none">
        <div class="pointer-events-auto bg-white rounded-t-2xl shadow-[0_-10px_40px_rgba(0,0,0,0.15)] border-t border-gray-200 max-h-[85vh] overflow-y-auto">
            <div class="p-6 max-w-5xl mx-auto">
                <div class="flex justify-between items-start mb-6 border-b border-slate-100 pb-4">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span id="detailCodigo" class="px-2 py-0.5 rounded text-[10px] font-black bg-slate-800 text-white uppercase tracking-wider"></span>
                            <span id="detailTipo" class="px-2 py-0.5 rounded text-[10px] font-bold border uppercase tracking-wider"></span>
                            <span id="detailFormatoBadge" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider border"></span>
                        </div>
                        <h3 id="detailTitle" class="text-2xl font-extrabold text-slate-900 leading-tight"></h3>
                        <p id="detailInfo" class="text-sm text-slate-500 font-medium mt-1"></p>
                    </div>
                    <button id="closeDetail" class="p-2 bg-slate-100 rounded-full hover:bg-slate-200 text-slate-500 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2 text-xs uppercase tracking-wide">
                            <span class="w-2 h-2 rounded-full bg-red-500"></span> Requisitos previos (Correlativas)
                        </h4>
                        <div id="correlativesList" class="space-y-2"></div>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2 text-xs uppercase tracking-wide">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Habilita cursar
                        </h4>
                        <div id="dependentsList" class="space-y-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
      
      // Mapeo de colores para la variable TIPO (Campos de Formación)
      const tipoColores = {
          "Formación General": "bg-[#eff6ff] text-[#1d4ed8] border-[#bfdbfe]",      // Azul
          "Formación Específica": "bg-[#ecfdf5] text-[#047857] border-[#a7f3d0]", // Verde Esmeralda
          "Práctica Profesional": "bg-[#faf5ff] text-[#7e22ce] border-[#d8b4fe]", // Violeta
          "default": "bg-gray-100 text-gray-700 border-gray-200"
      };

      // Mapeo de colores para la variable FORMATO
      const formatoColores = {
          "Asignatura": "bg-[#ffffff] text-[#64748b] border-[#e2e8f0]",
          "Taller": "bg-[#fffbeb] text-[#b45309] border-[#fcd34d] font-bold",
          "Seminario": "bg-[#ecfccb] text-[#3f6212] border-[#bef264] font-bold",
          "Seminario-Taller": "bg-[#fef9c3] text-[#854d0e] border-[#fde047]",
          "Variable": "bg-[#f8fafc] text-[#475569] border-[#cbd5e1] border-dashed",
          "default": "bg-white text-gray-500 border-gray-200"
      };

      // DATOS PLAN DE ESTUDIOS (Filosofía Res. 4793/15)
const materias = [
  // --- 1° AÑO ---
  { id: "pedagogia", codigo: "PED", nombre: "Pedagogía", anio: 1, horas: "96", tipo: "Formación General", formato: "Asignatura", correlativas: [], reqs: [] },
  { id: "corporeidad", codigo: "CJL", nombre: "Corporeidad, Juegos y Lenguajes Artísticos", anio: 1, horas: "96", tipo: "Formación General", formato: "Taller", correlativas: [], reqs: [] },
  { id: "oralidad", codigo: "OLE", nombre: "Oralidad, Lectura, Escritura y TIC", anio: 1, horas: "96", tipo: "Formación General", formato: "Taller", correlativas: [], reqs: [] },
  { id: "didactica-gral", codigo: "DG", nombre: "Didáctica General", anio: 1, horas: "96", tipo: "Formación General", formato: "Asignatura", correlativas: [], reqs: [] },
  { id: "filosofia-gral", codigo: "FIL", nombre: "Filosofía", anio: 1, horas: "96", tipo: "Formación General", formato: "Asignatura", correlativas: [], reqs: [] },
  { id: "logica", codigo: "LOG", nombre: "Introducción a la Lógica", anio: 1, horas: "96", tipo: "Formación Específica", formato: "Asignatura", correlativas: [], reqs: [] },
  { id: "antigua", codigo: "ANT", nombre: "Filosofía Antigua", anio: 1, horas: "160", tipo: "Formación Específica", formato: "Asignatura", correlativas: [], reqs: [] },
  { id: "antropologia", codigo: "ANTRO", nombre: "Antropología Filosófica", anio: 1, horas: "64", tipo: "Formación Específica", formato: "Asignatura", correlativas: [], reqs: [] },
  { id: "textos", codigo: "TXT", nombre: "Intr. a la Lectura y Análisis de Textos Filosóficos", anio: 1, horas: "64", tipo: "Formación Específica", formato: "Taller", correlativas: [], reqs: [] },
  { id: "practica-1", codigo: "PP1", nombre: "Práctica Profesional Docente I: Sujetos y Contextos", anio: 1, horas: "128", tipo: "Práctica Profesional", formato: "Seminario-Taller", correlativas: [], reqs: [] },

  // --- 2° AÑO ---
  { id: "historia-arg", codigo: "HSP", nombre: "Historia Social y Pol. Arg. y Latinoamericana", anio: 2, horas: "96", tipo: "Formación General", formato: "Asignatura", correlativas: [], reqs: [] },
  { id: "psico-ed", codigo: "PSI", nombre: "Psicología de la Educación", anio: 2, horas: "96", tipo: "Formación General", formato: "Asignatura", correlativas: ["pedagogia"], reqs: [{ id: "pedagogia", type: "R" }] },
  { id: "esi", codigo: "ESI", nombre: "Educación Sexual Integral", anio: 2, horas: "64", tipo: "Formación General", formato: "Taller", correlativas: ["corporeidad"], reqs: [{ id: "corporeidad", type: "R" }] },
  { id: "sujetos", codigo: "SUJ", nombre: "Sujetos de la Educación Secundaria", anio: 2, horas: "96", tipo: "Formación Específica", formato: "Seminario", correlativas: ["pedagogia", "psico-ed"], reqs: [{ id: "pedagogia", type: "R" }, { id: "psico-ed", type: "A" }] },
  { id: "didactica-filo", codigo: "DID-F", nombre: "Didáctica de la Filosofía", anio: 2, horas: "128", tipo: "Formación Específica", formato: "Asignatura", correlativas: ["didactica-gral", "antigua", "logica", "textos"], reqs: [{ id: "didactica-gral", type: "A" }, { id: "antigua", type: "A" }, { id: "logica", type: "R" }, { id: "textos", type: "R" }] },
  { id: "medieval", codigo: "MED", nombre: "Filosofía Medieval", anio: 2, horas: "160", tipo: "Formación Específica", formato: "Asignatura", correlativas: ["antigua"], reqs: [{ id: "antigua", type: "A" }] },
  { id: "metafisica", codigo: "MET", nombre: "Metafísica", anio: 2, horas: "96", tipo: "Formación Específica", formato: "Asignatura", correlativas: ["antigua", "antropologia"], reqs: [{ id: "antigua", type: "R" }, { id: "antropologia", type: "R" }] },
  { id: "teoria-conocimiento", codigo: "TC", nombre: "Teoría del Conocimiento", anio: 2, horas: "96", tipo: "Formación Específica", formato: "Asignatura", correlativas: ["logica", "textos"], reqs: [{ id: "logica", type: "R" }, { id: "textos", type: "R" }] },
  { id: "etica", codigo: "ET", nombre: "Ética", anio: 2, horas: "96", tipo: "Formación Específica", formato: "Asignatura", correlativas: ["antropologia"], reqs: [{ id: "antropologia", type: "A" }] },
  { id: "practica-2", codigo: "PP2", nombre: "Práctica Profesional Docente II", anio: 2, horas: "128", tipo: "Práctica Profesional", formato: "Seminario-Taller", correlativas: ["practica-1", "pedagogia", "didactica-gral"], reqs: [{ id: "practica-1", type: "A" }, { id: "pedagogia", type: "R" }, { id: "didactica-gral", type: "A" }] },

  // --- 3° AÑO ---
  { id: "historia-ed", codigo: "HIS-E", nombre: "Historia de la Educación Argentina", anio: 3, horas: "96", tipo: "Formación General", formato: "Asignatura", correlativas: ["pedagogia", "historia-arg"], reqs: [{ id: "pedagogia", type: "A" }, { id: "historia-arg", type: "R" }] },
  { id: "sociologia", codigo: "SOC", nombre: "Sociología de la Educación", anio: 3, horas: "96", tipo: "Formación General", formato: "Asignatura", correlativas: [], reqs: [] },
  { id: "instituciones", codigo: "INST", nombre: "Análisis y Org. de las Instituciones Educativas", anio: 3, horas: "96", tipo: "Formación General", formato: "Seminario", correlativas: ["sujetos", "practica-2"], reqs: [{ id: "sujetos", type: "R" }, { id: "practica-2", type: "A" }] },
  { id: "pensamiento-arg", codigo: "P-ARG", nombre: "Pensamiento Argentino y Latinoamericano", anio: 3, horas: "128", tipo: "Formación Específica", formato: "Asignatura", correlativas: ["historia-arg", "antigua"], reqs: [{ id: "historia-arg", type: "R" }, { id: "antigua", type: "R" }] },
  { id: "cultura", codigo: "FC", nombre: "Filosofía de la Cultura", anio: 3, horas: "96", tipo: "Formación Específica", formato: "Asignatura", correlativas: ["antropologia"], reqs: [{ id: "antropologia", type: "A" }] },
  { id: "etica-aplicada", codigo: "ET-A", nombre: "Ética Aplicada", anio: 3, horas: "64", tipo: "Formación Específica", formato: "Taller", correlativas: ["etica"], reqs: [{ id: "etica", type: "A" }] },
  { id: "moderna", codigo: "MOD", nombre: "Filosofía Moderna", anio: 3, horas: "160", tipo: "Formación Específica", formato: "Asignatura", correlativas: ["medieval", "teoria-conocimiento"], reqs: [{ id: "medieval", type: "A" }, { id: "teoria-conocimiento", type: "R" }] },
  { id: "epistemologia", codigo: "EPI", nombre: "Epistemología", anio: 3, horas: "128", tipo: "Formación Específica", formato: "Asignatura", correlativas: ["teoria-conocimiento", "logica"], reqs: [{ id: "teoria-conocimiento", type: "R" }, { id: "logica", type: "R" }] },
  { id: "udi-1", codigo: "UDI1", nombre: "UDI I", anio: 3, horas: "96", tipo: "Formación Específica", formato: "Variable", correlativas: [], reqs: [] },
  { id: "practica-3", codigo: "PP3", nombre: "Práctica Profesional Docente III", anio: 3, horas: "192", tipo: "Práctica Profesional", formato: "Seminario-Taller", correlativas: ["practica-2", "didactica-filo", "sujetos", "psico-ed"], reqs: [{ id: "practica-2", type: "A" }, { id: "didactica-filo", type: "R" }, { id: "sujetos", type: "R" }, { id: "psico-ed", type: "A" }, { isSpecial: true, text: "Todas las UC de 1° año (Esp.) Aprobadas", type: "A" }] },

  // --- 4° AÑO ---
  { id: "ddhh", codigo: "DDHH", nombre: "Derechos Humanos: Ética y Ciudadanía", anio: 4, horas: "96", tipo: "Formación General", formato: "Asignatura", correlativas: ["etica", "historia-arg"], reqs: [{ id: "etica", type: "R" }, { id: "historia-arg", type: "R" }] },
  { id: "politica", codigo: "POL", nombre: "Filosofía Política", anio: 4, horas: "96", tipo: "Formación Específica", formato: "Asignatura", correlativas: ["etica", "moderna"], reqs: [{ id: "etica", type: "A" }, { id: "moderna", type: "R" }] },
  { id: "metodologia", codigo: "MET", nombre: "Metodología de la Inv. Filosófica", anio: 4, horas: "64", tipo: "Formación Específica", formato: "Taller", correlativas: ["logica", "teoria-conocimiento"], reqs: [{ id: "logica", type: "R" }, { id: "teoria-conocimiento", type: "R" }] },
  { id: "contemporanea", codigo: "CONT", nombre: "Filosofía Contemporánea", anio: 4, horas: "128", tipo: "Formación Específica", formato: "Asignatura", correlativas: ["moderna"], reqs: [{ id: "moderna", type: "A" }] },
  { id: "estetica", codigo: "EST", nombre: "Estética", anio: 4, horas: "64", tipo: "Formación Específica", formato: "Asignatura", correlativas: ["cultura", "moderna"], reqs: [{ id: "cultura", type: "R" }, { id: "moderna", type: "R" }] },
  { id: "lenguaje", codigo: "LENG", nombre: "Filosofía del Lenguaje", anio: 4, horas: "96", tipo: "Formación Específica", formato: "Asignatura", correlativas: ["logica", "teoria-conocimiento"], reqs: [{ id: "logica", type: "R" }, { id: "teoria-conocimiento", type: "R" }] },
  { id: "problemas", codigo: "PROB", nombre: "Problemáticas Filosóficas Contemp.", anio: 4, horas: "64", tipo: "Formación Específica", formato: "Seminario", correlativas: ["moderna"], reqs: [{ id: "moderna", type: "R" }] },
  { id: "udi-2", codigo: "UDI2", nombre: "UDI II", anio: 4, horas: "96", tipo: "Formación Específica", formato: "Variable", correlativas: ["udi-1"], reqs: [{ id: "udi-1", type: "R" }] },
  { id: "residencia", codigo: "RES", nombre: "Práctica Profesional Docente IV: Residencia", anio: 4, horas: "320", tipo: "Práctica Profesional", formato: "Seminario-Taller", correlativas: ["practica-3", "moderna", "epistemologia", "etica-aplicada", "pensamiento-arg"], reqs: [{ id: "practica-3", type: "A" }, { id: "moderna", type: "A" }, { id: "epistemologia", type: "R" }, { id: "etica-aplicada", type: "R" }, { id: "pensamiento-arg", type: "R" }, { isSpecial: true, text: "Todas las UC de 1° y 2° año Aprobadas", type: "A" }] }
];


      // --- RENDER ---
      let searchTerm = "";
      let filterTipo = "";
      let filterFormato = "";
      let selectedMateria = null;

      const grid = document.getElementById("mainGrid");
      const detailPanel = document.getElementById("detailPanel");
      
      const getMateria = (id) => materias.find(m => m.id === id);
      const getDependents = (id) => materias.filter(m => m.correlativas.includes(id));

      const renderGrid = () => {
        if (!grid) return;
        grid.innerHTML = "";
        
        const filtered = materias.filter(m => {
            const matchSearch = m.nombre.toLowerCase().includes(searchTerm.toLowerCase()) || m.codigo.toLowerCase().includes(searchTerm.toLowerCase());
            const matchTipo = filterTipo === "" || m.tipo === filterTipo;
            const matchFormato = filterFormato === "" || m.formato === filterFormato;
            return matchSearch && matchTipo && matchFormato;
        });

        for(let i=1; i<=4; i++) {
            const materiasAnio = filtered.filter(m => m.anio === i);
            
            const col = document.createElement("div");
            col.className = "flex-none w-[300px] bg-white rounded-2xl border border-gray-200 shadow-sm flex flex-col overflow-hidden h-full";
            
            col.innerHTML = `
                <div class="px-4 py-3 border-b border-gray-100 bg-slate-50 flex items-center justify-between flex-shrink-0">
                    <h3 class="font-black text-slate-700 text-lg">${i}° Año</h3>
                    <span class="text-xs font-bold text-slate-400 bg-white px-2 py-1 rounded border border-gray-200">${materiasAnio.length}</span>
                </div>
                <div class="p-2 space-y-2 flex-1 overflow-y-auto" id="col-content-${i}">
                    <div class="regimen-divider"><span>Anual</span></div>
                </div>
            `;
            
            const colContent = col.querySelector(`#col-content-${i}`);
            
            materiasAnio.forEach(m => {
                const card = document.createElement("div");
                const isSelected = selectedMateria && selectedMateria.id === m.id;
                const badgeClass = tipoColores[m.tipo] || tipoColores["default"];
                const formatoClass = formatoColores[m.formato] || formatoColores["default"];
                
                const activeClass = isSelected ? "ring-2 ring-blue-500 shadow-md transform scale-[1.02]" : "hover:border-blue-300 hover:shadow-md";

                card.className = `p-3 bg-white border border-gray-100 rounded-xl cursor-pointer transition-all duration-200 group ${activeClass}`;
                
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2 mb-1">
                        <span class="text-[9px] font-black tracking-wide uppercase px-1.5 py-0.5 rounded border ${badgeClass}">${m.tipo}</span>
                        <span class="text-[9px] text-slate-400 font-bold">${m.codigo}</span>
                    </div>
                    <h4 class="font-bold text-xs text-slate-700 leading-snug group-hover:text-blue-700 transition-colors line-clamp-3">${m.nombre}</h4>
                    <div class="mt-2 flex items-center justify-between">
                        <span class="text-[9px] px-1.5 py-0.5 rounded ${formatoClass}">${m.formato}</span>
                        <span class="text-[9px] font-bold text-slate-300">${m.horas}hs</span>
                    </div>
                `;
                
                card.onclick = () => openDetail(m);
                colContent.appendChild(card);
            });

            grid.appendChild(col);
        }
    };

      const openDetail = (m) => {
          selectedMateria = m;
          renderGrid();
          
          detailPanel.classList.remove("translate-y-full");
          
          const badgeClass = tipoColores[m.tipo] || tipoColores["default"];
          const fmtClass = formatoColores[m.formato] || formatoColores["default"];

          const tipoEl = document.getElementById("detailTipo");
          tipoEl.textContent = m.tipo;
          tipoEl.className = `px-2 py-0.5 rounded text-[10px] font-bold border uppercase tracking-wider ${badgeClass}`;

          const fmtBadge = document.getElementById("detailFormatoBadge");
          fmtBadge.textContent = m.formato;
          fmtBadge.className = `px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${fmtClass}`;

          document.getElementById("detailTitle").textContent = m.nombre;
          document.getElementById("detailCodigo").textContent = m.codigo;
          document.getElementById("detailInfo").textContent = `${m.anio}° Año | Anual | ${m.horas} horas cátedra anuales`;

          // REQUISITOS
          const reqList = document.getElementById("correlativesList");
          reqList.innerHTML = "";
          
          if(m.reqs.length === 0) {
              reqList.innerHTML = `<div class="p-3 bg-slate-50 rounded-lg border border-dashed border-slate-200 text-xs text-slate-400 text-center italic">No se requieren materias previas.</div>`;
          } else {
              m.reqs.forEach(r => {
                  const el = document.createElement("div");
                  if(r.isSpecial) {
                       el.className = "flex items-center gap-3 p-3 rounded-lg bg-blue-50 text-blue-800 border border-blue-100";
                       el.innerHTML = `<span class="text-xs font-bold uppercase">${r.text}</span>`;
                  } else {
                      const matReq = getMateria(r.id);
                      if(matReq) {
                          el.className = "flex items-center gap-3 p-2 rounded-lg bg-white border border-gray-100 hover:border-red-200 hover:bg-red-50 cursor-pointer transition-colors group";
                          el.innerHTML = `
                             <span class="w-8 h-8 flex-shrink-0 flex items-center justify-center text-[9px] font-black bg-slate-100 text-slate-500 rounded-lg group-hover:bg-white group-hover:text-red-500 transition-colors uppercase">${matReq.codigo}</span>
                             <div class="flex-1">
                                <div class="text-xs font-bold text-slate-700 group-hover:text-red-700">${matReq.nombre}</div>
                                <div class="text-[10px] font-bold text-red-400 uppercase tracking-wider mt-0.5">${r.type === 'R' ? 'Regularizada' : 'Aprobada'}</div>
                             </div>
                          `;
                          el.onclick = () => openDetail(matReq);
                      }
                  }
                  reqList.appendChild(el);
              });
          }

          // HABILITA
          const depList = document.getElementById("dependentsList");
          depList.innerHTML = "";
          const dependientes = getDependents(m.id);
          
          if(dependientes.length === 0) {
               depList.innerHTML = `<div class="p-3 bg-slate-50 rounded-lg border border-dashed border-slate-200 text-xs text-slate-400 text-center italic">No es correlativa de ninguna materia posterior.</div>`;
          } else {
              dependientes.forEach(d => {
                  const el = document.createElement("div");
                  const requirement = d.reqs.find(r => r.id === m.id);
                  const condition = requirement ? (requirement.type === 'R' ? 'Para Cursar' : 'Para Rendir') : '';

                  el.className = "flex items-center gap-3 p-2 rounded-lg bg-white border border-gray-100 hover:border-emerald-200 hover:bg-emerald-50 cursor-pointer transition-colors group";
                  el.innerHTML = `
                     <span class="w-8 h-8 flex-shrink-0 flex items-center justify-center text-[9px] font-black bg-emerald-50 text-emerald-600 rounded-lg border border-emerald-100 uppercase">${d.codigo}</span>
                     <div class="flex-1">
                        <div class="text-xs font-bold text-slate-700 group-hover:text-emerald-800">${d.nombre}</div>
                        <div class="text-[10px] text-slate-400 mt-0.5">Habilita: <span class="font-bold text-emerald-600 uppercase">${condition}</span></div>
                     </div>
                  `;
                  el.onclick = () => openDetail(d);
                  depList.appendChild(el);
              });
          }
      };

      // EVENTOS
      if(document.getElementById("closeDetail")) {
          document.getElementById("closeDetail").onclick = () => {
              detailPanel.classList.add("translate-y-full");
              selectedMateria = null;
              renderGrid();
          };
      }
      
      if(document.getElementById("searchInput")) {
          document.getElementById("searchInput").addEventListener("input", (e) => {
              searchTerm = e.target.value;
              renderGrid();
          });
      }
      
      if(document.getElementById("filterTipo")) {
          document.getElementById("filterTipo").addEventListener("change", (e) => {
              filterTipo = e.target.value;
              renderGrid();
          });
      }

      if(document.getElementById("filterFormato")) {
          document.getElementById("filterFormato").addEventListener("change", (e) => {
              filterFormato = e.target.value;
              renderGrid();
          });
      }

      if(document.getElementById("resetBtn")) {
          document.getElementById("resetBtn").onclick = () => {
              searchTerm = "";
              filterTipo = "";
              filterFormato = "";
              document.getElementById("searchInput").value = "";
              document.getElementById("filterTipo").value = "";
              document.getElementById("filterFormato").value = "";
              renderGrid();
          };
      }

      renderGrid();
    });
</script>

</body>
</html>
