<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Plan de Correlatividades - Profesorado de Psicología</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        
        /* Scrollbars personalizados */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

<body class="p-4 lg:p-8 text-slate-800 h-screen flex flex-col overflow-hidden">

<div id="cascadaApp" class="w-full max-w-[1800px] mx-auto flex flex-col h-full space-y-4">

    <!-- Header -->
    <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 flex-shrink-0">
        <div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Profesorado de Psicología <span class="text-slate-400 font-normal">| Res. 4797/15</span></h2>
            <p class="mt-1 text-sm text-slate-500 font-medium">
                Mapa interactivo de correlatividades. <span class="text-blue-600 font-bold">Clic en una materia</span> para ver detalles.
            </p>
        </div>
        
        <div class="flex flex-col items-end gap-2">
            <!-- Leyenda de Tipos (Áreas) -->
            <div class="flex flex-wrap gap-2 text-[10px] font-bold uppercase justify-end opacity-90">
                <span class="px-2 py-1 rounded border bg-blue-50 text-blue-700 border-blue-200">Formación General</span>
                <span class="px-2 py-1 rounded border bg-emerald-50 text-emerald-700 border-emerald-200">Formación Específica</span>
                <span class="px-2 py-1 rounded border bg-violet-50 text-violet-700 border-violet-200">Práctica Profesional</span>
            </div>
            <!-- Leyenda de Formatos -->
            <div class="flex flex-wrap gap-2 text-[10px] uppercase justify-end">
                <span class="px-2 py-0.5 rounded border bg-orange-50 text-orange-700 border-orange-200 font-bold">Taller</span>
                <span class="px-2 py-0.5 rounded border bg-fuchsia-50 text-fuchsia-700 border-fuchsia-200 font-bold">Seminario</span>
                <span class="px-2 py-0.5 rounded border bg-slate-100 text-slate-600 border-slate-300 font-bold">Variable (UDI)</span>
            </div>
        </div>
    </div>

    <!-- Controles -->
    <div class="bg-white p-3 rounded-2xl border border-gray-200 shadow-sm z-30 flex-shrink-0">
        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div class="relative flex-1 w-full sm:max-w-xs">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Buscar materia..." class="pl-9 w-full rounded-xl border-gray-200 bg-slate-50 p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
            </div>

            <div class="flex gap-2 w-full sm:w-auto">
                <!-- Filtro por Formato -->
                <select id="filterFormato" class="flex-1 sm:flex-none rounded-xl border border-gray-200 px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-100 outline-none">
                    <option value="">Todos los Formatos</option>
                    <option value="Asignatura">Asignatura</option>
                    <option value="Seminario">Seminario</option>
                    <option value="Taller">Taller</option>
                    <option value="Práctica">Práctica</option>
                    <option value="Variable">UDI / Variable</option>
                </select>
                <!-- Filtro por Tipo -->
                <select id="filterTipo" class="flex-1 sm:flex-none rounded-xl border border-gray-200 px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-100 outline-none">
                    <option value="">Todos los Campos</option>
                    <option value="Formación General">Formación General</option>
                    <option value="Formación Específica">Formación Específica</option>
                    <option value="Práctica Profesional">Práctica Profesional</option>
                </select>
                <button id="resetBtn" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-bold transition-colors">Limpiar</button>
            </div>
        </div>
    </div>

    <!-- Grid Principal (Scroll Horizontal Puro) -->
    <div class="flex-1 overflow-x-auto overflow-y-hidden pb-2">
        <div id="mainGrid" class="flex flex-nowrap gap-5 h-full px-1">
            <!-- Las columnas se generan aquí dinámicamente -->
        </div>
    </div>

    <!-- Panel de Detalles -->
    <div id="detailPanel" class="fixed inset-x-0 bottom-0 z-50 transform translate-y-full transition-transform duration-300 ease-in-out pointer-events-none">
        <div class="pointer-events-auto bg-white rounded-t-2xl shadow-[0_-10px_40px_rgba(0,0,0,0.15)] border-t border-gray-200 max-h-[85vh] overflow-y-auto">
            <div class="p-6 max-w-5xl mx-auto">
                <div class="flex justify-between items-start mb-6 border-b border-slate-100 pb-4">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span id="detailCodigo" class="px-2 py-0.5 rounded text-[10px] font-black bg-slate-800 text-white uppercase tracking-wider"></span>
                            <span id="detailTipo" class="px-2 py-0.5 rounded text-[10px] font-bold border uppercase tracking-wider"></span>
                            <span id="detailFormatoBadge" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider border"></span>
                        </div>
                        <h3 id="detailTitle" class="text-2xl font-extrabold text-slate-900 leading-tight"></h3>
                        <p id="detailInfo" class="text-sm text-slate-500 font-medium mt-1"></p>
                    </div>
                    <button id="closeDetail" class="p-2 bg-slate-100 rounded-full hover:bg-slate-200 text-slate-500 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2 text-xs uppercase tracking-wide">
                            <span class="w-2 h-2 rounded-full bg-red-500"></span> Para cursar necesitas
                        </h4>
                        <div id="correlativesList" class="space-y-2"></div>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2 text-xs uppercase tracking-wide">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Te habilita cursar
                        </h4>
                        <div id="dependentsList" class="space-y-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
      
      // Mapeo de colores para TIPO (Áreas de Formación)
      const tipoColores = {
          "Formación General": "bg-blue-50 text-blue-700 border-blue-200",
          "Formación Específica": "bg-emerald-50 text-emerald-700 border-emerald-200",
          "Práctica Profesional": "bg-violet-50 text-violet-700 border-violet-200",
          "default": "bg-gray-100 text-gray-700 border-gray-200"
      };

      // Mapeo de colores para FORMATO
      const formatoColores = {
          "Asignatura": "bg-[#ffffff] text-[#64748b] border-[#e2e8f0]",
          "Taller": "bg-orange-50 text-orange-700 border-orange-200 font-bold",
          "Seminario": "bg-fuchsia-50 text-fuchsia-700 border-fuchsia-200 font-bold",
          "Seminario-Taller": "bg-fuchsia-50 text-fuchsia-700 border-fuchsia-200 font-bold",
          "Práctica": "bg-violet-50 text-violet-700 border-violet-200 font-bold",
          "Variable": "bg-slate-50 text-slate-600 border-slate-200",
          "default": "bg-white text-gray-500 border-gray-200"
      };

      // DATOS PSICOLOGÍA - Sin propiedad 'cuatri'
      const materias = [
        // 1er Año
        { id: "pedagogia", codigo: "PED", nombre: "Pedagogía", anio: 1, horas: "3 hs", tipo: "Formación General", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "corporeidad", codigo: "CJA", nombre: "Corporeidad, juegos y lenguajes artísticos", anio: 1, horas: "3 hs", tipo: "Formación General", formato: "Taller", correlativas: [], reqs: [] },
        { id: "didactica-gral", codigo: "DG", nombre: "Didáctica General", anio: 1, horas: "3 hs", tipo: "Formación General", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "oralidad", codigo: "OLET", nombre: "Oralidad, lectura, escritura y TIC", anio: 1, horas: "3 hs", tipo: "Formación General", formato: "Taller", correlativas: [], reqs: [] },
        { id: "hist-psico", codigo: "HP", nombre: "Historia de la Psicología", anio: 1, horas: "3 hs", tipo: "Formación Específica", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "psico-gral", codigo: "PG", nombre: "Psicología General", anio: 1, horas: "5 hs", tipo: "Formación Específica", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "biologia", codigo: "BH", nombre: "Biología Humana", anio: 1, horas: "4 hs", tipo: "Formación Específica", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "psico-des-1", codigo: "PD1", nombre: "Psicología del Desarrollo I", anio: 1, horas: "3 hs", tipo: "Formación Específica", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "practica-1", codigo: "PPD1", nombre: "Práctica Prof. Docente I: Sujetos y contextos", anio: 1, horas: "4 hs", tipo: "Práctica Profesional", formato: "Práctica", correlativas: [], reqs: [] },

        // 2do Año
        { id: "filosofia", codigo: "FIL", nombre: "Filosofía", anio: 2, horas: "3 hs", tipo: "Formación General", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "hist-arg-lat", codigo: "HSPL", nombre: "Historia social, política arg. y latinoamericana", anio: 2, horas: "2 hs", tipo: "Formación General", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "psico-educ", codigo: "PE", nombre: "Psicología de la Educación", anio: 2, horas: "3 hs", tipo: "Formación General", formato: "Asignatura", 
          correlativas: ["psico-gral", "pedagogia"], reqs: [{id:"psico-gral", type:"R"}, {id:"pedagogia", type:"R"}] },
        { id: "didactica-psico-1", codigo: "DP1", nombre: "Didáctica de la Psicología I", anio: 2, horas: "3 hs", tipo: "Formación Específica", formato: "Asignatura", 
          correlativas: ["didactica-gral", "psico-gral"], reqs: [{id:"didactica-gral", type:"A"}, {id:"psico-gral", type:"R"}] },
        { id: "corrientes-psico", codigo: "CPC", nombre: "Corrientes de la Psico. Contemp. y Latinoamericana", anio: 2, horas: "5 hs", tipo: "Formación Específica", formato: "Asignatura", 
          correlativas: ["hist-psico"], reqs: [{id:"hist-psico", type:"R"}] },
        { id: "psicolinguistica", codigo: "PL", nombre: "Psicolingüística", anio: 2, horas: "3 hs", tipo: "Formación Específica", formato: "Asignatura", 
          correlativas: ["psico-gral"], reqs: [{id:"psico-gral", type:"R"}] },
        { id: "prob-epist", codigo: "PEP", nombre: "Problemas Epistemológicos en Psicología", anio: 2, horas: "3 hs", tipo: "Formación Específica", formato: "Asignatura", 
          correlativas: ["hist-psico"], reqs: [{id:"hist-psico", type:"R"}] },
        { id: "psico-des-2", codigo: "PD2", nombre: "Psicología del Desarrollo II", anio: 2, horas: "4 hs", tipo: "Formación Específica", formato: "Asignatura", 
          correlativas: ["psico-des-1"], reqs: [{id:"psico-des-1", type:"R"}] },
        { id: "sujeto-secundaria", codigo: "SES", nombre: "Sujeto de la Educación Secundaria", anio: 2, horas: "3 hs", tipo: "Formación Específica", formato: "Asignatura", 
          correlativas: ["psico-des-1", "pedagogia"], reqs: [{id:"psico-des-1", type:"R"}, {id:"pedagogia", type:"R"}] },
        { id: "practica-2", codigo: "PPD2", nombre: "Práctica Prof. Docente II: Educ. Sec. y práctica docente", anio: 2, horas: "4 hs", tipo: "Práctica Profesional", formato: "Práctica", 
          correlativas: ["practica-1", "didactica-gral", "pedagogia"], reqs: [{id:"practica-1", type:"A"}, {id:"didactica-gral", type:"A"}, {id:"pedagogia", type:"A"}] },

        // 3er Año
        { id: "analisis-inst", codigo: "AOIE", nombre: "Análisis y org. de las instituciones educativas", anio: 3, horas: "3 hs", tipo: "Formación General", formato: "Seminario", 
          correlativas: ["practica-2"], reqs: [{id:"practica-2", type:"R"}] },
        { id: "socio-educ", codigo: "SE", nombre: "Sociología de la educación", anio: 3, horas: "3 hs", tipo: "Formación General", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "hist-educ-arg", codigo: "HEA", nombre: "Historia de la educación argentina", anio: 3, horas: "3 hs", tipo: "Formación General", formato: "Asignatura", 
          correlativas: ["pedagogia", "hist-arg-lat"], reqs: [{id:"pedagogia", type:"R"}, {id:"hist-arg-lat", type:"R"}] },
        { id: "salud-mental", codigo: "SMPP", nombre: "Salud Mental y Políticas Públicas", anio: 3, horas: "3 hs", tipo: "Formación Específica", formato: "Asignatura", 
          correlativas: ["psico-gral", "biologia"], reqs: [{id:"psico-gral", type:"R"}, {id:"biologia", type:"R"}] },
        { id: "antropo-filo", codigo: "AFC", nombre: "Antropología Filosófica y Cultural", anio: 3, horas: "3 hs", tipo: "Formación Específica", formato: "Asignatura", 
          correlativas: ["filosofia"], reqs: [{id:"filosofia", type:"R"}] },
        { id: "teorias-psicoan", codigo: "TP", nombre: "Teorías Psicoanalíticas", anio: 3, horas: "4 hs", tipo: "Formación Específica", formato: "Asignatura", 
          correlativas: ["psico-gral", "hist-psico"], reqs: [{id:"psico-gral", type:"R"}, {id:"hist-psico", type:"R"}] },
        { id: "didactica-psico-2", codigo: "DP2", nombre: "Didáctica de la Psicología II", anio: 3, horas: "3 hs", tipo: "Formación Específica", formato: "Asignatura", 
          correlativas: ["didactica-psico-1"], reqs: [{id:"didactica-psico-1", type:"A"}] },
        { id: "metodologia-inv", codigo: "MIP", nombre: "Metodología de la Inv. Psicológica", anio: 3, horas: "3 hs", tipo: "Formación Específica", formato: "Taller", 
          correlativas: ["prob-epist", "psico-gral"], reqs: [{id:"prob-epist", type:"R"}, {id:"psico-gral", type:"R"}] },
        { id: "udi-1", codigo: "UDI1", nombre: "UDI I", anio: 3, horas: "3 hs", tipo: "Formación Específica", formato: "Variable", correlativas: [], reqs: [] },
        { id: "practica-3", codigo: "PPD3", nombre: "Práctica Prof. Docente III: Cotidianeidad en las aulas", anio: 3, horas: "6 hs", tipo: "Práctica Profesional", formato: "Práctica", 
          correlativas: ["practica-2", "didactica-psico-1", "psico-des-2", "psicolinguistica"], reqs: [{id:"practica-2", type:"A"}, {id:"didactica-psico-1", type:"A"}, {id:"psico-des-2", type:"R"}, {id:"psicolinguistica", type:"R"}] },

        // 4to Año
        { id: "ddhh", codigo: "DHEC", nombre: "Derechos humanos: ética y ciudadanía", anio: 4, horas: "3 hs", tipo: "Formación General", formato: "Asignatura", 
          correlativas: ["filosofia", "hist-arg-lat"], reqs: [{id:"filosofia", type:"R"}, {id:"hist-arg-lat", type:"R"}] },
        { id: "esi", codigo: "ESI", nombre: "Educación Sexual Integral", anio: 4, horas: "2 hs", tipo: "Formación General", formato: "Taller", 
          correlativas: ["corporeidad", "biologia"], reqs: [{id:"corporeidad", type:"R"}, {id:"biologia", type:"R"}] },
        { id: "orientacion", codigo: "OEVL", nombre: "Orientación Educ., Vocacional y Laboral", anio: 4, horas: "4 hs", tipo: "Formación Específica", formato: "Taller", 
          correlativas: ["psico-educ", "psico-des-2"], reqs: [{id:"psico-educ", type:"R"}, {id:"psico-des-2", type:"R"}] },
        { id: "psico-clinica", codigo: "PCIE", nombre: "Psicología Clínica e Intervención Educativa", anio: 4, horas: "3 hs", tipo: "Formación Específica", formato: "Asignatura", 
          correlativas: ["salud-mental", "teorias-psicoan", "psico-des-2"], reqs: [{id:"salud-mental", type:"R"}, {id:"teorias-psicoan", type:"R"}, {id:"psico-des-2", type:"R"}] },
        { id: "psico-social", codigo: "PSI", nombre: "Psicología Social e Institucional", anio: 4, horas: "3 hs", tipo: "Formación Específica", formato: "Taller", 
          correlativas: ["psico-gral", "socio-educ"], reqs: [{id:"psico-gral", type:"R"}, {id:"socio-educ", type:"R"}] },
        { id: "mediacion", codigo: "MP", nombre: "Mediación Psicoeducativa", anio: 4, horas: "3 hs", tipo: "Formación Específica", formato: "Taller", 
          correlativas: ["psico-educ"], reqs: [{id:"psico-educ", type:"R"}] },
        { id: "udi-2", codigo: "UDI2", nombre: "UDI II", anio: 4, horas: "3 hs", tipo: "Formación Específica", formato: "Variable", correlativas: [], reqs: [] },
        { id: "prob-contemp", codigo: "PCP", nombre: "Problemáticas Contemp. de la Psicología", anio: 4, horas: "3 hs", tipo: "Formación Específica", formato: "Seminario", 
          correlativas: ["corrientes-psico", "teorias-psicoan"], reqs: [{id:"corrientes-psico", type:"R"}, {id:"teorias-psicoan", type:"R"}] },
        { id: "practica-4", codigo: "RES", nombre: "Práctica Prof. Docente IV: Residencia", anio: 4, horas: "10 hs", tipo: "Práctica Profesional", formato: "Práctica", 
          correlativas: ["practica-3", "didactica-psico-2", "metodologia-inv", "salud-mental", "teorias-psicoan", "antropo-filo"], reqs: [{id:"practica-3", type:"A"}, {id:"didactica-psico-2", type:"A"}, {id:"metodologia-inv", type:"A"}, {id:"salud-mental", type:"A"}, {id:"teorias-psicoan", type:"A"}, {id:"antropo-filo", type:"A"}] },
      ];

      // --- RENDER ---
      let searchTerm = "";
      let filterTipo = "";
      let filterFormato = "";
      let selectedMateria = null;

      const grid = document.getElementById("mainGrid");
      const detailPanel = document.getElementById("detailPanel");
      
      const getMateria = (id) => materias.find(m => m.id === id);
      const getDependents = (id) => materias.filter(m => m.correlativas.includes(id));

      const renderGrid = () => {
        grid.innerHTML = "";
        
        const filtered = materias.filter(m => {
            const matchSearch = m.nombre.toLowerCase().includes(searchTerm.toLowerCase()) || m.codigo.includes(searchTerm.toUpperCase());
            const matchTipo = filterTipo === "" || m.tipo === filterTipo;
            const matchFormato = filterFormato === "" || (filterFormato === "Práctica" ? m.formato.includes("Práctica") : m.formato === filterFormato);
            return matchSearch && matchTipo && matchFormato;
        });

        for(let i=1; i<=4; i++) {
            const materiasAnio = filtered.filter(m => m.anio === i);
            
            const col = document.createElement("div");
            col.className = "flex-none w-[280px] bg-white rounded-2xl border border-gray-200 shadow-sm flex flex-col overflow-hidden h-full";
            
            col.innerHTML = `
                <div class="px-4 py-3 border-b border-gray-100 bg-slate-50 flex items-center justify-between flex-shrink-0">
                    <h3 class="font-black text-slate-700 text-lg">${i}° Año</h3>
                    <span class="text-xs font-bold text-slate-400 bg-white px-2 py-1 rounded border border-gray-200">${materiasAnio.length}</span>
                </div>
                <div class="p-2 space-y-2 flex-1 overflow-y-auto" id="col-content-${i}"></div>
            `;
            
            const colContent = col.querySelector(`#col-content-${i}`);
            
            // Renderizado directo sin separadores
            if(materiasAnio.length > 0) {
                materiasAnio.forEach(m => {
                    const card = document.createElement("div");
                    const isSelected = selectedMateria && selectedMateria.id === m.id;
                    const badgeClass = tipoColores[m.tipo] || tipoColores["default"];
                    const formatoClass = formatoColores[m.formato] || formatoColores["default"];
                    
                    const activeClass = isSelected ? "ring-2 ring-blue-500 shadow-md transform scale-[1.02]" : "hover:border-blue-300 hover:shadow-md";
                    
                    const formatoDisplay = m.formato === "Variable" ? "UDI" : m.formato;

                    card.className = `p-3 bg-white border border-gray-100 rounded-xl cursor-pointer transition-all duration-200 group ${activeClass}`;
                    
                    // Extraer "General", "Específica" o "Profesional" para el badge pequeño
                    const tipoShort = m.tipo.replace("Formación ", "").replace("Práctica ", "");

                    card.innerHTML = `
                        <div class="flex items-start justify-between gap-2 mb-1">
                            <span class="text-[9px] font-black tracking-wide uppercase px-1.5 py-0.5 rounded border ${badgeClass}">${tipoShort}</span>
                            <span class="text-[9px] text-slate-400 font-bold">${m.codigo}</span>
                        </div>
                        <h4 class="font-bold text-xs text-slate-700 leading-snug group-hover:text-blue-700 transition-colors line-clamp-2">${m.nombre}</h4>
                        <div class="mt-2 flex items-center justify-between">
                            <span class="text-[9px] px-1.5 py-0.5 rounded ${formatoClass}">${formatoDisplay}</span>
                            <span class="text-[9px] font-bold text-slate-300">${m.horas}</span>
                        </div>
                    `;
                    
                    card.onclick = () => openDetail(m);
                    colContent.appendChild(card);
                });
            } else {
                colContent.innerHTML = `<div class="p-4 text-center text-xs text-gray-400 italic">No hay materias</div>`;
            }

            grid.appendChild(col);
        }
    };

      const openDetail = (m) => {
          selectedMateria = m;
          renderGrid();
          
          detailPanel.classList.remove("translate-y-full");
          
          const badgeClass = tipoColores[m.tipo] || tipoColores["default"];
          const fmtClass = formatoColores[m.formato] || formatoColores["default"];

          const tipoEl = document.getElementById("detailTipo");
          tipoEl.textContent = m.tipo;
          tipoEl.className = `px-2 py-0.5 rounded text-[10px] font-bold border uppercase tracking-wider ${badgeClass}`;

          const fmtBadge = document.getElementById("detailFormatoBadge");
          fmtBadge.textContent = m.formato === "Variable" ? "Unidad de Definición Institucional" : m.formato;
          fmtBadge.className = `px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${fmtClass}`;

          document.getElementById("detailTitle").textContent = m.nombre;
          document.getElementById("detailCodigo").textContent = m.codigo;
          // Eliminar referencia a cuatrimestre aquí también
          document.getElementById("detailInfo").textContent = `${m.anio}° Año | Régimen: Anual | Carga Horaria: ${m.horas}`;

          // REQUISITOS (Correlativas previas)
          const reqList = document.getElementById("correlativesList");
          reqList.innerHTML = "";
          
          if(m.reqs.length === 0) {
              reqList.innerHTML = `<div class="p-3 bg-slate-50 rounded-lg border border-dashed border-slate-200 text-xs text-slate-400 text-center italic">No se requieren materias previas.</div>`;
          } else {
              m.reqs.forEach(r => {
                  const el = document.createElement("div");
                  if(r.isSpecial) {
                       el.className = "flex items-center gap-3 p-3 rounded-lg bg-red-50 text-red-800 border border-red-100";
                       el.innerHTML = `<span class="text-xs font-bold uppercase">${r.text}</span>`;
                  } else {
                      const matReq = getMateria(r.id);
                      if(matReq) {
                          el.className = "flex items-center gap-3 p-2 rounded-lg bg-white border border-gray-100 hover:border-red-200 hover:bg-red-50 cursor-pointer transition-colors group";
                          el.innerHTML = `
                             <span class="w-8 h-8 flex items-center justify-center text-[9px] font-black bg-slate-100 text-slate-500 rounded-lg group-hover:bg-white group-hover:text-red-500 transition-colors uppercase">${matReq.codigo}</span>
                             <div class="flex-1">
                                <div class="text-xs font-bold text-slate-700 group-hover:text-red-700">${matReq.nombre}</div>
                                <div class="text-[10px] font-bold text-red-400 uppercase tracking-wider mt-0.5">${r.type === 'R' ? 'Regularizada' : 'Aprobada'}</div>
                             </div>
                          `;
                          el.onclick = () => openDetail(matReq);
                      }
                  }
                  reqList.appendChild(el);
              });
          }

          // HABILITA (Correlativas posteriores)
          const depList = document.getElementById("dependentsList");
          depList.innerHTML = "";
          const dependientes = getDependents(m.id);
          
          if(dependientes.length === 0) {
               depList.innerHTML = `<div class="p-3 bg-slate-50 rounded-lg border border-dashed border-slate-200 text-xs text-slate-400 text-center italic">No es correlativa de ninguna materia posterior.</div>`;
          } else {
              dependientes.forEach(d => {
                  const el = document.createElement("div");
                  const requirement = d.reqs.find(r => r.id === m.id);
                  const condition = requirement ? (requirement.type === 'R' ? 'Para Cursar' : 'Para Rendir') : '';

                  el.className = "flex items-center gap-3 p-2 rounded-lg bg-white border border-gray-100 hover:border-emerald-200 hover:bg-emerald-50 cursor-pointer transition-colors group";
                  el.innerHTML = `
                     <span class="w-8 h-8 flex items-center justify-center text-[9px] font-black bg-emerald-50 text-emerald-600 rounded-lg border border-emerald-100 uppercase">${d.codigo}</span>
                     <div class="flex-1">
                        <div class="text-xs font-bold text-slate-700 group-hover:text-emerald-800">${d.nombre}</div>
                        <div class="text-[10px] text-slate-400 mt-0.5">Habilita: <span class="font-bold text-emerald-600 uppercase">${condition}</span></div>
                     </div>
                  `;
                  el.onclick = () => openDetail(d);
                  depList.appendChild(el);
              });
          }
      };

      // EVENTOS
      document.getElementById("closeDetail").onclick = () => {
          detailPanel.classList.add("translate-y-full");
          selectedMateria = null;
          renderGrid();
      };
      
      document.getElementById("searchInput").addEventListener("input", (e) => {
          searchTerm = e.target.value;
          renderGrid();
      });
      
      document.getElementById("filterTipo").addEventListener("change", (e) => {
          filterTipo = e.target.value;
          renderGrid();
      });

      document.getElementById("filterFormato").addEventListener("change", (e) => {
          filterFormato = e.target.value;
          renderGrid();
      });

      document.getElementById("resetBtn").onclick = () => {
          searchTerm = "";
          filterTipo = "";
          filterFormato = "";
          document.getElementById("searchInput").value = "";
          document.getElementById("filterTipo").value = "";
          document.getElementById("filterFormato").value = "";
          renderGrid();
      };

      renderGrid();
    });
</script>

</body>
</html>
