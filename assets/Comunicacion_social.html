<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Plan de Correlatividades - Tec. Sup. Comunicación Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        
        /* Scrollbars personalizados */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

<body class="p-4 lg:p-8 text-slate-800 h-screen flex flex-col overflow-hidden">

<div id="cascadaApp" class="w-full max-w-[1800px] mx-auto flex flex-col h-full space-y-4">

    <!-- Header -->
    <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 flex-shrink-0">
        <div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Tecnicatura Superior en Comunicación Social</h2>
            <p class="mt-1 text-sm text-slate-500 font-medium">
                Mapa de correlatividades (Res. 0830/15 CGE). <span class="text-emerald-600 font-bold">Clic en una materia</span> para ver detalles.
            </p>
        </div>
        
        <div class="flex flex-col items-end gap-2">
            <!-- Leyenda de Tipos (Campos de Formación) -->
            <div class="flex flex-wrap gap-2 text-[10px] font-bold uppercase justify-end opacity-80">
                <span class="px-2 py-1 rounded border bg-[#eff6ff] text-[#1d4ed8] border-[#bfdbfe]">Formación General</span>
                <span class="px-2 py-1 rounded border bg-[#fff7ed] text-[#c2410c] border-[#fed7aa]">Fundamentos</span>
                <span class="px-2 py-1 rounded border bg-[#ecfdf5] text-[#047857] border-[#a7f3d0]">Formación Específica</span>
                <span class="px-2 py-1 rounded border bg-[#f5f3ff] text-[#6d28d9] border-[#ddd6fe]">Práctica Profesional</span>
            </div>
            <!-- Leyenda de Formatos -->
            <div class="flex flex-wrap gap-2 text-[10px] uppercase justify-end">
                <span class="px-2 py-0.5 rounded border bg-[#ffffff] text-[#64748b] border-[#e2e8f0] font-bold">Asignatura</span>
                <span class="px-2 py-0.5 rounded border bg-[#fffbeb] text-[#b45309] border-[#fcd34d] font-bold">Taller</span>
                <span class="px-2 py-0.5 rounded border bg-[#fff1f2] text-[#be123c] border-[#fda4af] font-bold">Seminario</span>
                <span class="px-2 py-0.5 rounded border bg-[#fdf4ff] text-[#a21caf] border-[#f0abfc] font-bold">EDI (Variable)</span>
            </div>
        </div>
    </div>

    <!-- Controles -->
    <div class="bg-white p-3 rounded-2xl border border-gray-200 shadow-sm z-30 flex-shrink-0">
        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div class="relative flex-1 w-full sm:max-w-xs">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Buscar materia..." class="pl-9 w-full rounded-xl border-gray-200 bg-slate-50 p-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
            </div>

            <div class="flex gap-2 w-full sm:w-auto">
                <!-- Filtro por Formato -->
                <select id="filterFormato" class="flex-1 sm:flex-none rounded-xl border border-gray-200 px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-emerald-100 outline-none">
                    <option value="">Todos los Formatos</option>
                    <option value="Asignatura">Asignaturas</option>
                    <option value="Taller">Talleres</option>
                    <option value="Seminario">Seminarios</option>
                    <option value="Variable">EDI</option>
                </select>
                <!-- Filtro por Tipo -->
                <select id="filterTipo" class="flex-1 sm:flex-none rounded-xl border border-gray-200 px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-emerald-100 outline-none">
                    <option value="">Todos los Campos</option>
                    <option value="Formación General">General</option>
                    <option value="Formación de Fundamentos">Fundamentos</option>
                    <option value="Formación Específica">Específica</option>
                    <option value="Práctica Profesional">Práctica</option>
                </select>
                <button id="resetBtn" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-bold transition-colors">Limpiar</button>
            </div>
        </div>
    </div>

    <!-- Grid Principal (Scroll Horizontal Puro) -->
    <div class="flex-1 overflow-x-auto overflow-y-hidden pb-2">
        <div id="mainGrid" class="flex flex-nowrap gap-5 h-full px-1 min-w-min">
            <!-- Las columnas se generan aquí dinámicamente -->
        </div>
    </div>

    <!-- Panel de Detalles -->
    <div id="detailPanel" class="fixed inset-x-0 bottom-0 z-50 transform translate-y-full transition-transform duration-300 ease-in-out pointer-events-none">
        <div class="pointer-events-auto bg-white rounded-t-2xl shadow-[0_-10px_40px_rgba(0,0,0,0.15)] border-t border-gray-200 max-h-[85vh] overflow-y-auto">
            <div class="p-6 max-w-5xl mx-auto">
                <div class="flex justify-between items-start mb-6 border-b border-slate-100 pb-4">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span id="detailCodigo" class="px-2 py-0.5 rounded text-[10px] font-black bg-slate-800 text-white uppercase tracking-wider"></span>
                            <span id="detailTipo" class="px-2 py-0.5 rounded text-[10px] font-bold border uppercase tracking-wider"></span>
                            <span id="detailFormatoBadge" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider border"></span>
                        </div>
                        <h3 id="detailTitle" class="text-2xl font-extrabold text-slate-900 leading-tight"></h3>
                        <p id="detailInfo" class="text-sm text-slate-500 font-medium mt-1"></p>
                    </div>
                    <button id="closeDetail" class="p-2 bg-slate-100 rounded-full hover:bg-slate-200 text-slate-500 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2 text-xs uppercase tracking-wide">
                            <span class="w-2 h-2 rounded-full bg-red-500"></span> Requisitos para rendir
                        </h4>
                        <div id="correlativesList" class="space-y-2"></div>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2 text-xs uppercase tracking-wide">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Te habilita cursar
                        </h4>
                        <div id="dependentsList" class="space-y-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
      
      // Mapeo de colores (Actualizado con "Fundamentos")
      const tipoColores = {
          "Formación Específica": "bg-[#ecfdf5] text-[#047857] border-[#a7f3d0]",      // Verde
          "Formación General": "bg-[#eff6ff] text-[#1d4ed8] border-[#bfdbfe]",         // Azul
          "Formación de Fundamentos": "bg-[#fff7ed] text-[#c2410c] border-[#fed7aa]",  // Naranja/Ambar (Nuevo)
          "Práctica Profesional": "bg-[#f5f3ff] text-[#6d28d9] border-[#ddd6fe]",      // Violeta
          "default": "bg-gray-100 text-gray-700 border-gray-200"
      };

      const formatoColores = {
          "Asignatura": "bg-[#ffffff] text-[#64748b] border-[#e2e8f0]",
          "Taller": "bg-[#fffbeb] text-[#b45309] border-[#fcd34d] font-bold",
          "Seminario": "bg-[#fff1f2] text-[#be123c] border-[#fda4af] font-bold",
          "Variable": "bg-[#fdf4ff] text-[#a21caf] border-[#f0abfc] font-bold", // Para EDI
          "default": "bg-white text-gray-500 border-gray-200"
      };

      // DATOS: TECNICATURA SUPERIOR EN COMUNICACIÓN SOCIAL (Res. 0830/15)
      // Variable cuatri eliminada (null)
      const materias = [
        // --- 1° AÑO ---
        { id: "ODL", codigo: "01", nombre: "Organizaciones y Desarrollo Local", anio: 1, cuatri: null, horas: 64, tipo: "Formación General", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "MTIS", codigo: "02", nombre: "Metodología y Técnica de la Investigación Social", anio: 1, cuatri: null, horas: 64, tipo: "Formación General", formato: "Taller", correlativas: [], reqs: [] },
        { id: "ICOM", codigo: "03", nombre: "Introducción a la Comunicación", anio: 1, cuatri: null, horas: 128, tipo: "Formación de Fundamentos", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "PFIL", codigo: "04", nombre: "Problemáticas filosóficas", anio: 1, cuatri: null, horas: 96, tipo: "Formación de Fundamentos", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "PSC", codigo: "05", nombre: "Problemas Socioculturales Contemporáneos", anio: 1, cuatri: null, horas: 96, tipo: "Formación de Fundamentos", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "POE", codigo: "06", nombre: "Producción Oral y Escrita", anio: 1, cuatri: null, horas: 96, tipo: "Formación Específica", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "MLT", codigo: "07", nombre: "Medios, Lenguajes y Técnicas", anio: 1, cuatri: null, horas: 96, tipo: "Formación Específica", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "TIC", codigo: "08", nombre: "Introducción a las TICS", anio: 1, cuatri: null, horas: 128, tipo: "Formación Específica", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "PP1", codigo: "09", nombre: "Práctica Profesionalizante I", anio: 1, cuatri: null, horas: 192, tipo: "Práctica Profesional", formato: "Taller", correlativas: [], reqs: [] },
        { id: "UDI1", codigo: "10", nombre: "E.D.I.", anio: 1, cuatri: null, horas: 96, tipo: "Formación Específica", formato: "Variable", correlativas: [], reqs: [] },

        // --- 2° AÑO ---
        { id: "PSH", codigo: "01", nombre: "Procesos socio-históricos modernos y contemporáneos", anio: 2, cuatri: null, horas: 64, tipo: "Formación General", formato: "Asignatura", 
          correlativas: [], reqs: [] },
        { id: "EMP", codigo: "02", nombre: "Emprendedorismo Local", anio: 2, cuatri: null, horas: 64, tipo: "Formación General", formato: "Asignatura", 
          correlativas: ["ODL"], reqs: [{ id: "ODL", type: "A" }] },
        { id: "TCOM", codigo: "03", nombre: "Teorías de la Comunicación", anio: 2, cuatri: null, horas: 96, tipo: "Formación de Fundamentos", formato: "Asignatura", 
          correlativas: ["ICOM"], reqs: [{ id: "ICOM", type: "A" }] },
        { id: "CCD", codigo: "04", nombre: "Comunicación, Cultura y Desarrollo Local", anio: 2, cuatri: null, horas: 96, tipo: "Formación de Fundamentos", formato: "Seminario", 
          correlativas: ["ICOM", "ODL"], reqs: [{ id: "ICOM", type: "A" }, { id: "ODL", type: "A" }] },
        { id: "CORG", codigo: "05", nombre: "Comunicación Organizacional", anio: 2, cuatri: null, horas: 96, tipo: "Formación de Fundamentos", formato: "Asignatura", 
          correlativas: [], reqs: [] },
        { id: "CINT", codigo: "06", nombre: "Comunicación Interpersonal", anio: 2, cuatri: null, horas: 64, tipo: "Formación Específica", formato: "Asignatura", 
          correlativas: ["ICOM"], reqs: [{ id: "ICOM", type: "A" }] },
        { id: "TCV", codigo: "07", nombre: "Técnica de la Comunicación Visual", anio: 2, cuatri: null, horas: 96, tipo: "Formación Específica", formato: "Taller", 
          correlativas: ["MLT", "ICOM"], reqs: [{ id: "MLT", type: "A" }, { id: "ICOM", type: "A" }] },
        { id: "NTCD", codigo: "08", nombre: "Nuevas Tecnologías y Comunicación Digital", anio: 2, cuatri: null, horas: 64, tipo: "Formación Específica", formato: "Taller", 
          correlativas: ["TIC", "MLT"], reqs: [{ id: "TIC", type: "A" }, { id: "MLT", type: "A" }] },
        { id: "RAD", codigo: "09", nombre: "Producción Radiofónica y Audio", anio: 2, cuatri: null, horas: 128, tipo: "Formación Específica", formato: "Taller", 
          correlativas: [], reqs: [] },
        { id: "PP2", codigo: "10", nombre: "Práctica Profesionalizante II", anio: 2, cuatri: null, horas: 192, tipo: "Práctica Profesional", formato: "Taller", 
          correlativas: ["PP1"], reqs: [{ id: "PP1", type: "A" }] },
        { id: "UDI2", codigo: "11", nombre: "E.D.I.", anio: 2, cuatri: null, horas: 64, tipo: "Formación Específica", formato: "Variable", correlativas: [], reqs: [] },

        // --- 3° AÑO ---
        { id: "APM", codigo: "01", nombre: "Análisis Político y Medios de Comunicación", anio: 3, cuatri: null, horas: 64, tipo: "Formación General", formato: "Asignatura", 
          correlativas: ["CCD"], reqs: [{ id: "CCD", type: "A" }] },
        { id: "HSEA", codigo: "02", nombre: "Historia social y económica argentina", anio: 3, cuatri: null, horas: 64, tipo: "Formación General", formato: "Asignatura", 
          correlativas: ["PSH"], reqs: [{ id: "PSH", type: "A" }] },
        { id: "DDHH", codigo: "03", nombre: "Derechos Humanos", anio: 3, cuatri: null, horas: 96, tipo: "Formación General", formato: "Asignatura", 
          correlativas: [], reqs: [] },
        { id: "DINF", codigo: "04", nombre: "Derecho de la Información", anio: 3, cuatri: null, horas: 64, tipo: "Formación de Fundamentos", formato: "Asignatura", 
          correlativas: [], reqs: [] },
        { id: "MYC", codigo: "05", nombre: "Medios y Ciudadanía", anio: 3, cuatri: null, horas: 96, tipo: "Formación de Fundamentos", formato: "Asignatura", 
          correlativas: ["CCD", "TCOM"], reqs: [{ id: "CCD", type: "A" }, { id: "TCOM", type: "A" }] },
        { id: "CAV", codigo: "06", nombre: "Comunicación audiovisual", anio: 3, cuatri: null, horas: 64, tipo: "Formación Específica", formato: "Taller", 
          correlativas: ["TCV"], reqs: [{ id: "TCV", type: "A" }] },
        { id: "GPC", codigo: "07", nombre: "Gestión de Proyectos Comunicacionales", anio: 3, cuatri: null, horas: 64, tipo: "Formación Específica", formato: "Taller", 
          correlativas: [], reqs: [] },
        { id: "INV", codigo: "08", nombre: "Periodismo de Investigación", anio: 3, cuatri: null, horas: 96, tipo: "Formación Específica", formato: "Seminario", 
          correlativas: ["MLT", "POE"], reqs: [{ id: "MLT", type: "A" }, { id: "POE", type: "A" }] },
        { id: "TV", codigo: "09", nombre: "Televisión", anio: 3, cuatri: null, horas: 128, tipo: "Formación Específica", formato: "Taller", 
          correlativas: [], reqs: [] },
        { id: "PP3", codigo: "10", nombre: "Práctica Profesionalizante III", anio: 3, cuatri: null, horas: 224, tipo: "Práctica Profesional", formato: "Taller", 
          correlativas: ["PP2"], reqs: [{ id: "PP2", type: "A" }] },
        { id: "UDI3", codigo: "11", nombre: "E.D.I.", anio: 3, cuatri: null, horas: 96, tipo: "Formación Específica", formato: "Variable", correlativas: [], reqs: [] },
      ];

      // --- RENDER ---
      let searchTerm = "";
      let filterTipo = "";
      let filterFormato = "";
      let selectedMateria = null;

      const grid = document.getElementById("mainGrid");
      const detailPanel = document.getElementById("detailPanel");
      
      const getMateria = (id) => materias.find(m => m.id === id);
      const getDependents = (id) => materias.filter(m => m.correlativas.includes(id));

      const renderGrid = () => {
        grid.innerHTML = "";
        
        const filtered = materias.filter(m => {
            const matchSearch = m.nombre.toLowerCase().includes(searchTerm.toLowerCase()) || m.codigo.includes(searchTerm.toUpperCase());
            const matchTipo = filterTipo === "" || m.tipo === filterTipo;
            const matchFormato = filterFormato === "" || m.formato.includes(filterFormato);
            return matchSearch && matchTipo && matchFormato;
        });

        for(let i=1; i<=3; i++) {
            const materiasAnio = filtered.filter(m => m.anio === i);
            
            const col = document.createElement("div");
            col.className = "flex-none w-[320px] bg-white rounded-2xl border border-gray-200 shadow-sm flex flex-col overflow-hidden h-full";
            
            col.innerHTML = `
                <div class="px-4 py-3 border-b border-gray-100 bg-slate-50 flex items-center justify-between flex-shrink-0">
                    <h3 class="font-black text-slate-700 text-lg">${i}° Año</h3>
                    <span class="text-xs font-bold text-emerald-400 bg-white px-2 py-1 rounded border border-gray-200">${materiasAnio.length}</span>
                </div>
                <div class="p-2 space-y-2 flex-1 overflow-y-auto" id="col-content-${i}"></div>
            `;
            
            const colContent = col.querySelector(`#col-content-${i}`);
            
            if(materiasAnio.length > 0) {
                // Se eliminó el divisor de cuatrimestres
                materiasAnio.forEach(m => {
                    const card = document.createElement("div");
                    const isSelected = selectedMateria && selectedMateria.id === m.id;
                    const badgeClass = tipoColores[m.tipo] || tipoColores["default"];
                    const formatoClass = formatoColores[m.formato] || formatoColores["default"];
                    
                    const activeClass = isSelected ? "ring-2 ring-emerald-500 shadow-md transform scale-[1.02]" : "hover:border-emerald-300 hover:shadow-md";
                    
                    let formatoDisplay = m.formato;
                    if (m.formato === "Variable") formatoDisplay = "EDI";

                    // Acortar nombres largos de tipos para la tarjeta
                    let tipoCorto = m.tipo;
                    if(tipoCorto === "Formación de Fundamentos") tipoCorto = "Fundamentos";
                    if(tipoCorto === "Formación General") tipoCorto = "General";
                    if(tipoCorto === "Formación Específica") tipoCorto = "Específica";
                    if(tipoCorto === "Práctica Profesional") tipoCorto = "Práctica";

                    card.className = `p-3 bg-white border border-gray-100 rounded-xl cursor-pointer transition-all duration-200 group ${activeClass}`;
                    
                    card.innerHTML = `
                        <div class="flex items-start justify-between gap-2 mb-1">
                            <span class="text-[9px] font-black tracking-wide uppercase px-1.5 py-0.5 rounded border ${badgeClass}">${tipoCorto}</span>
                            <span class="text-[9px] text-slate-400 font-bold">#${m.codigo}</span>
                        </div>
                        <h4 class="font-bold text-xs text-slate-700 leading-snug group-hover:text-emerald-700 transition-colors line-clamp-2">${m.nombre}</h4>
                        <div class="mt-2 flex items-center justify-between">
                            <span class="text-[9px] px-1.5 py-0.5 rounded ${formatoClass}">${formatoDisplay}</span>
                            <span class="text-[9px] font-bold text-slate-300">~${m.horas}hs</span>
                        </div>
                    `;
                    
                    card.onclick = () => openDetail(m);
                    colContent.appendChild(card);
                });
            }

            grid.appendChild(col);
        }
    };

      const openDetail = (m) => {
          selectedMateria = m;
          renderGrid();
          
          detailPanel.classList.remove("translate-y-full");
          
          const badgeClass = tipoColores[m.tipo] || tipoColores["default"];
          const fmtClass = formatoColores[m.formato] || formatoColores["default"];

          const tipoEl = document.getElementById("detailTipo");
          tipoEl.textContent = m.tipo;
          tipoEl.className = `px-2 py-0.5 rounded text-[10px] font-bold border uppercase tracking-wider ${badgeClass}`;

          const fmtBadge = document.getElementById("detailFormatoBadge");
          fmtBadge.textContent = m.formato === "Variable" ? "EDI" : m.formato;
          fmtBadge.className = `px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${fmtClass}`;

          document.getElementById("detailTitle").textContent = m.nombre;
          document.getElementById("detailCodigo").textContent = `Cód: ${m.codigo}`;
          document.getElementById("detailInfo").textContent = `${m.anio}° Año | Anual | ~${m.horas} hs anuales`;

          // REQUISITOS
          const reqList = document.getElementById("correlativesList");
          reqList.innerHTML = "";
          
          if(m.reqs.length === 0) {
              reqList.innerHTML = `<div class="p-3 bg-slate-50 rounded-lg border border-dashed border-slate-200 text-xs text-slate-400 text-center italic">No se requieren materias previas.</div>`;
          } else {
              m.reqs.forEach(r => {
                  const el = document.createElement("div");
                  const matReq = getMateria(r.id);
                  if(matReq) {
                      el.className = "flex items-center gap-3 p-2 rounded-lg bg-white border border-gray-100 hover:border-red-200 hover:bg-red-50 cursor-pointer transition-colors group";
                      
                      // Para este plan, el PDF dice "Para rendir debe tener aprobadas".
                      const badgeType = 'Aprobada'; 
                      const badgeColor = 'text-red-500';

                      el.innerHTML = `
                         <span class="w-8 h-8 flex items-center justify-center text-[9px] font-black bg-slate-100 text-slate-500 rounded-lg group-hover:bg-white group-hover:text-red-500 transition-colors uppercase">${matReq.codigo}</span>
                         <div class="flex-1">
                            <div class="text-xs font-bold text-slate-700 group-hover:text-red-700">${matReq.nombre}</div>
                            <div class="text-[10px] font-bold ${badgeColor} uppercase tracking-wider mt-0.5">${badgeType}</div>
                         </div>
                      `;
                      el.onclick = () => openDetail(matReq);
                      reqList.appendChild(el);
                  }
              });
          }

          // HABILITA
          const depList = document.getElementById("dependentsList");
          depList.innerHTML = "";
          let dependientes = getDependents(m.id);

          if(dependientes.length === 0) {
               depList.innerHTML = `<div class="p-3 bg-slate-50 rounded-lg border border-dashed border-slate-200 text-xs text-slate-400 text-center italic">No habilita correlativas posteriores.</div>`;
          } else {
              dependientes.forEach(d => {
                  const el = document.createElement("div");
                  const condition = "Para Rendir";

                  el.className = "flex items-center gap-3 p-2 rounded-lg bg-white border border-gray-100 hover:border-emerald-200 hover:bg-emerald-50 cursor-pointer transition-colors group";
                  el.innerHTML = `
                     <span class="w-8 h-8 flex items-center justify-center text-[9px] font-black bg-emerald-50 text-emerald-600 rounded-lg border border-emerald-100 uppercase">${d.codigo}</span>
                     <div class="flex-1">
                        <div class="text-xs font-bold text-slate-700 group-hover:text-emerald-800">${d.nombre}</div>
                        <div class="text-[10px] text-slate-400 mt-0.5">Habilita: <span class="font-bold text-emerald-600 uppercase">${condition}</span></div>
                     </div>
                  `;
                  el.onclick = () => openDetail(d);
                  depList.appendChild(el);
              });
          }
      };

      // EVENTOS
      document.getElementById("closeDetail").onclick = () => {
          detailPanel.classList.add("translate-y-full");
          selectedMateria = null;
          renderGrid();
      };
      
      document.getElementById("searchInput").addEventListener("input", (e) => {
          searchTerm = e.target.value;
          renderGrid();
      });
      
      document.getElementById("filterTipo").addEventListener("change", (e) => {
          filterTipo = e.target.value;
          renderGrid();
      });

      document.getElementById("filterFormato").addEventListener("change", (e) => {
          filterFormato = e.target.value;
          renderGrid();
      });

      document.getElementById("resetBtn").onclick = () => {
          searchTerm = "";
          filterTipo = "";
          filterFormato = "";
          document.getElementById("searchInput").value = "";
          document.getElementById("filterTipo").value = "";
          document.getElementById("filterFormato").value = "";
          renderGrid();
      };

      renderGrid();
    });
</script>

</body>
</html>
