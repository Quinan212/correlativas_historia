<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Plan de Correlatividades - Contador Público (Plan 2020)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        
        .cuatrimestre-divider {
            display: flex;
            align-items: center;
            margin: 1.25rem 0 0.5rem 0;
            color: #94a3b8;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .cuatrimestre-divider::before, .cuatrimestre-divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px dashed #cbd5e1;
        }
        .cuatrimestre-divider span { margin: 0 10px; }
        
        /* Scrollbars personalizados */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

<body class="p-4 lg:p-8 text-slate-800 h-screen flex flex-col overflow-hidden">

<div id="cascadaApp" class="w-full max-w-[1800px] mx-auto flex flex-col h-full space-y-4">

    <!-- Header -->
    <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 flex-shrink-0">
        <div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Contador Público <span class="text-slate-400 font-normal">| Plan 2020</span></h2>
            <p class="mt-1 text-sm text-slate-500 font-medium">
                Mapa interactivo. <span class="text-blue-600 font-bold">Clic en una materia</span> para ver detalles.
            </p>
        </div>
        
        <div class="flex flex-col items-end gap-2">
            <!-- Leyenda de Tipos (Áreas) -->
            <div class="flex flex-wrap gap-2 text-[10px] font-bold uppercase justify-end opacity-80">
                <span class="px-2 py-1 rounded border bg-[#ecfdf5] text-[#047857] border-[#a7f3d0]">Contable</span>
                <span class="px-2 py-1 rounded border bg-[#fef2f2] text-[#b91c1c] border-[#fecaca]">Jurídica</span>
                <span class="px-2 py-1 rounded border bg-[#eff6ff] text-[#1d4ed8] border-[#bfdbfe]">Economía</span>
                <span class="px-2 py-1 rounded border bg-[#fff7ed] text-[#c2410c] border-[#fed7aa]">Admin</span>
                <span class="px-2 py-1 rounded border bg-[#f5f3ff] text-[#6d28d9] border-[#ddd6fe]">Mate</span>
            </div>
            <!-- Leyenda de Formatos -->
            <div class="flex flex-wrap gap-2 text-[10px] uppercase justify-end">
                <span class="px-2 py-0.5 rounded border bg-[#fffbeb] text-[#b45309] border-[#fcd34d] font-bold">Taller</span>
                <span class="px-2 py-0.5 rounded border bg-[#faf5ff] text-[#7e22ce] border-[#d8b4fe] font-bold">Práctica</span>
            </div>
        </div>
    </div>

    <!-- Controles -->
    <div class="bg-white p-3 rounded-2xl border border-gray-200 shadow-sm z-30 flex-shrink-0">
        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div class="relative flex-1 w-full sm:max-w-xs">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Buscar materia o código..." class="pl-9 w-full rounded-xl border-gray-200 bg-slate-50 p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
            </div>

            <div class="flex gap-2 w-full sm:w-auto">
                <!-- Filtro por Formato -->
                <select id="filterFormato" class="flex-1 sm:flex-none rounded-xl border border-gray-200 px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-100 outline-none">
                    <option value="">Todos los Formatos</option>
                    <option value="Asignatura">Asignaturas</option>
                    <option value="Taller">Talleres</option>
                    <option value="Práctica">Prácticas</option>
                    <option value="Electiva">Electivas</option>
                </select>
                <!-- Filtro por Tipo (Antes Área) -->
                <select id="filterTipo" class="flex-1 sm:flex-none rounded-xl border border-gray-200 px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-100 outline-none">
                    <option value="">Todos los Tipos</option>
                    <option value="Contable">Contable</option>
                    <option value="Jurídica">Jurídica</option>
                    <option value="Economía">Economía</option>
                    <option value="Administración">Administración</option>
                    <option value="Matemática">Matemática</option>
                    <option value="Humanística">Humanística</option>
                </select>
                <button id="resetBtn" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-bold transition-colors">Limpiar</button>
            </div>
        </div>
    </div>

    <!-- Grid Principal (Scroll Horizontal Puro) -->
    <div class="flex-1 overflow-x-auto overflow-y-hidden pb-2">
        <div id="mainGrid" class="flex flex-nowrap gap-5 h-full px-1">
            <!-- Las columnas se generan aquí dinámicamente -->
        </div>
    </div>

    <!-- Panel de Detalles -->
    <div id="detailPanel" class="fixed inset-x-0 bottom-0 z-50 transform translate-y-full transition-transform duration-300 ease-in-out pointer-events-none">
        <div class="pointer-events-auto bg-white rounded-t-2xl shadow-[0_-10px_40px_rgba(0,0,0,0.15)] border-t border-gray-200 max-h-[85vh] overflow-y-auto">
            <div class="p-6 max-w-5xl mx-auto">
                <div class="flex justify-between items-start mb-6 border-b border-slate-100 pb-4">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span id="detailCodigo" class="px-2 py-0.5 rounded text-[10px] font-black bg-slate-800 text-white uppercase tracking-wider"></span>
                            <span id="detailTipo" class="px-2 py-0.5 rounded text-[10px] font-bold border uppercase tracking-wider"></span>
                            <span id="detailFormatoBadge" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider border"></span>
                        </div>
                        <h3 id="detailTitle" class="text-2xl font-extrabold text-slate-900 leading-tight"></h3>
                        <p id="detailInfo" class="text-sm text-slate-500 font-medium mt-1"></p>
                    </div>
                    <button id="closeDetail" class="p-2 bg-slate-100 rounded-full hover:bg-slate-200 text-slate-500 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2 text-xs uppercase tracking-wide">
                            <span class="w-2 h-2 rounded-full bg-red-500"></span> Para cursar necesitas
                        </h4>
                        <div id="correlativesList" class="space-y-2"></div>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2 text-xs uppercase tracking-wide">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Te habilita cursar
                        </h4>
                        <div id="dependentsList" class="space-y-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
      
      // Mapeo de colores para la variable TIPO (Áreas de conocimiento)
      const tipoColores = {
          "Contable": "bg-[#ecfdf5] text-[#047857] border-[#a7f3d0]",      // Verde
          "Jurídica": "bg-[#fef2f2] text-[#b91c1c] border-[#fecaca]",      // Rojo
          "Economía": "bg-[#eff6ff] text-[#1d4ed8] border-[#bfdbfe]",      // Azul
          "Administración": "bg-[#fff7ed] text-[#c2410c] border-[#fed7aa]",// Naranja
          "Matemática": "bg-[#f5f3ff] text-[#6d28d9] border-[#ddd6fe]",   // Violeta
          "Humanística": "bg-[#fdf4ff] text-[#a21caf] border-[#f0abfc]",   // Rosa
          "Flexible": "bg-[#f1f5f9] text-[#475569] border-[#e2e8f0]",     // Gris
          "Integración": "bg-slate-800 text-white border-slate-900",       // Oscuro
          "default": "bg-gray-100 text-gray-700 border-gray-200"
      };

      // Mapeo de colores para la variable FORMATO (Asignatura, Taller, etc.)
      const formatoColores = {
          "Asignatura": "bg-[#ffffff] text-[#64748b] border-[#e2e8f0]",
          "Taller": "bg-[#fffbeb] text-[#b45309] border-[#fcd34d] font-bold",
          "Práctica": "bg-[#faf5ff] text-[#7e22ce] border-[#d8b4fe] font-bold",
          "Electiva": "bg-[#f8fafc] text-[#475569] border-[#cbd5e1] border-dashed",
          "default": "bg-white text-gray-500 border-gray-200"
      };

      // DATOS PLAN 2020 UNIFICADO
      // 'tipo' = Área de conocimiento | 'formato' = Modalidad
      const materias = [
        // --- 1° AÑO ---
        { id: "ICO", codigo: "ICO", nombre: "Introducción a la Contabilidad", anio: 1, cuatri: 1, horas: 84, tipo: "Contable", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "IEC", codigo: "IEC", nombre: "Introducción a la Economía", anio: 1, cuatri: 1, horas: 84, tipo: "Economía", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "ID1", codigo: "ID1", nombre: "Instituciones del Derecho I", anio: 1, cuatri: 1, horas: 63, tipo: "Jurídica", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "FCC", codigo: "FCC", nombre: "Filosofía y Conocimiento Científico", anio: 1, cuatri: 1, horas: 42, tipo: "Humanística", formato: "Asignatura", correlativas: [], reqs: [] },

        { id: "ALG", codigo: "ALG", nombre: "Álgebra Aplicada a las Cs. Ec.", anio: 1, cuatri: 2, horas: 84, tipo: "Matemática", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "ADG", codigo: "ADG", nombre: "Administración General", anio: 1, cuatri: 2, horas: 84, tipo: "Administración", formato: "Asignatura", correlativas: [], reqs: [] },
        { id: "CO1", codigo: "CO1", nombre: "Contabilidad I", anio: 1, cuatri: 2, horas: 84, tipo: "Contable", formato: "Asignatura",
          correlativas: ["ICO"], reqs: [{id:"ICO", type:"R"}] },
        { id: "HES", codigo: "HES", nombre: "Historia Económica y Social", anio: 1, cuatri: 2, horas: 42, tipo: "Humanística", formato: "Asignatura", correlativas: [], reqs: [] },

        // --- 2° AÑO ---
        { id: "CAL", codigo: "CAL", nombre: "Cálculo Aplicado a las Cs. Ec.", anio: 2, cuatri: 1, horas: 84, tipo: "Matemática", formato: "Asignatura",
          correlativas: ["ALG"], reqs: [{id:"ALG", type:"R"}] },
        { id: "SYT", codigo: "SYT", nombre: "Sistemas y Tecnologías", anio: 2, cuatri: 1, horas: 84, tipo: "Administración", formato: "Asignatura",
          correlativas: ["ADG"], reqs: [{id:"ADG", type:"R"}] },
        { id: "ID2", codigo: "ID2", nombre: "Instituciones del Derecho II", anio: 2, cuatri: 1, horas: 84, tipo: "Jurídica", formato: "Asignatura",
          correlativas: [], reqs: [] },
        { id: "MIC", codigo: "MIC", nombre: "Microeconomía", anio: 2, cuatri: 1, horas: 63, tipo: "Economía", formato: "Asignatura",
          correlativas: ["IEC"], reqs: [{id:"IEC", type:"R"}] },

        { id: "MET", codigo: "MET", nombre: "Metodología de la Investigación", anio: 2, cuatri: 2, horas: 63, tipo: "Humanística", formato: "Asignatura",
          correlativas: ["FCC"], reqs: [{id:"FCC", type:"R"}] },
        { id: "SOC", codigo: "SOC", nombre: "Sociedades y Asociaciones", anio: 2, cuatri: 2, horas: 63, tipo: "Jurídica", formato: "Asignatura",
          correlativas: ["ID1", "ID2"], reqs: [{id:"ID1", type:"R"}, {id:"ID2", type:"R"}] },
        { id: "MAC", codigo: "MAC", nombre: "Macroeconomía", anio: 2, cuatri: 2, horas: 63, tipo: "Economía", formato: "Asignatura",
          correlativas: ["MIC"], reqs: [{id:"MIC", type:"R"}] },
        { id: "CO2", codigo: "CO2", nombre: "Contabilidad II", anio: 2, cuatri: 2, horas: 84, tipo: "Contable", formato: "Asignatura",
          correlativas: ["CO1"], reqs: [{id:"CO1", type:"R"}] },

        // --- 3° AÑO ---
        { id: "EST", codigo: "EST", nombre: "Estadística", anio: 3, cuatri: 1, horas: 84, tipo: "Matemática", formato: "Asignatura",
          correlativas: ["CAL"], reqs: [{id:"CAL", type:"R"}] },
        { id: "FPU", codigo: "FPU", nombre: "Finanzas Públicas", anio: 3, cuatri: 1, horas: 84, tipo: "Economía", formato: "Asignatura",
          correlativas: ["ID1", "MAC"], reqs: [{id:"ID1", type:"R"}, {id:"MAC", type:"R"}] },
        { id: "EF1", codigo: "EF1", nombre: "Espacio Flexible I", anio: 3, cuatri: 1, horas: 63, tipo: "Flexible", formato: "Electiva",
          correlativas: [], reqs: [] },
        { id: "CO3", codigo: "CO3", nombre: "Contabilidad III", anio: 3, cuatri: 1, horas: 42, tipo: "Contable", formato: "Asignatura",
          correlativas: ["CO2"], reqs: [{id:"CO2", type:"R"}] },

        { id: "SCO", codigo: "SCO", nombre: "Sistemas de Costos", anio: 3, cuatri: 2, horas: 63, tipo: "Contable", formato: "Asignatura",
          correlativas: ["CO1", "SYT"], reqs: [{id:"CO1", type:"R"}, {id:"SYT", type:"R"}] },
        { id: "IM1", codigo: "IM1", nombre: "Impuestos I", anio: 3, cuatri: 2, horas: 84, tipo: "Contable", formato: "Asignatura",
          correlativas: ["SOC", "FPU"], reqs: [{id:"SOC", type:"R"}, {id:"FPU", type:"R"}] },
        { id: "CFA", codigo: "CFA", nombre: "Cálculo Financiero y Actuarial", anio: 3, cuatri: 2, horas: 84, tipo: "Matemática", formato: "Asignatura",
          correlativas: ["EST"], reqs: [{id:"EST", type:"R"}] },
        { id: "DTS", codigo: "DTS", nombre: "Derecho del Trabajo y SS", anio: 3, cuatri: 2, horas: 63, tipo: "Jurídica", formato: "Asignatura",
          correlativas: ["ID1", "ID2"], reqs: [{id:"ID1", type:"R"}, {id:"ID2", type:"R"}] },

        // --- 4° AÑO ---
        { id: "CO4", codigo: "CO4", nombre: "Contabilidad IV", anio: 4, cuatri: 1, horas: 42, tipo: "Contable", formato: "Asignatura",
          correlativas: ["CO3"], reqs: [{id:"CO3", type:"R"}] },
        { id: "CON", codigo: "CON", nombre: "Concursos", anio: 4, cuatri: 1, horas: 63, tipo: "Jurídica", formato: "Asignatura",
          correlativas: ["SOC"], reqs: [{id:"SOC", type:"R"}] },
        { id: "CGE", codigo: "CGE", nombre: "Costos para la Gestión", anio: 4, cuatri: 1, horas: 63, tipo: "Contable", formato: "Asignatura",
          correlativas: ["SCO"], reqs: [{id:"SCO", type:"R"}] },
        { id: "IM2", codigo: "IM2", nombre: "Impuestos II", anio: 4, cuatri: 1, horas: 84, tipo: "Contable", formato: "Asignatura",
          correlativas: ["IM1"], reqs: [{id:"IM1", type:"R"}] },

        { id: "AUD", codigo: "AUD", nombre: "Auditoría", anio: 4, cuatri: 2, horas: 84, tipo: "Contable", formato: "Asignatura",
          correlativas: ["SYT", "CO4"], reqs: [{id:"SYT", type:"R"}, {id:"CO4", type:"R"}] },
        { id: "IM3", codigo: "IM3", nombre: "Impuestos III", anio: 4, cuatri: 2, horas: 84, tipo: "Contable", formato: "Asignatura",
          correlativas: ["IM2"], reqs: [{id:"IM2", type:"R"}] },
        { id: "GTH", codigo: "GTH", nombre: "Gestión del Talento Humano", anio: 4, cuatri: 2, horas: 63, tipo: "Administración", formato: "Asignatura",
          correlativas: ["ADG", "SCO"], reqs: [{id:"ADG", type:"R"}, {id:"SCO", type:"R"}] },
        { id: "CPU", codigo: "CPU", nombre: "Contabilidad Pública", anio: 4, cuatri: 2, horas: 84, tipo: "Contable", formato: "Asignatura",
          correlativas: ["CO2", "FPU"], reqs: [{id:"CO2", type:"R"}, {id:"FPU", type:"R"}] },

        // --- 5° AÑO ---
        { id: "ADF", codigo: "ADF", nombre: "Administración Financiera", anio: 5, cuatri: 1, horas: 84, tipo: "Administración", formato: "Asignatura",
          correlativas: ["CFA", "CO4"], reqs: [{id:"CFA", type:"R"}, {id:"CO4", type:"R"}] },
        { id: "CO5", codigo: "CO5", nombre: "Contabilidad V", anio: 5, cuatri: 1, horas: 42, tipo: "Contable", formato: "Asignatura",
          correlativas: ["CO4"], reqs: [{id:"CO4", type:"R"}] },
        { id: "TPJ", codigo: "TPJ", nombre: "Taller de Práctica Jurídica", anio: 5, cuatri: 1, horas: 63, tipo: "Jurídica", formato: "Taller",
          correlativas: ["DTS", "CON", "AUD"], reqs: [{id:"DTS", type:"R"}, {id:"CON", type:"R"}, {id:"AUD", type:"R"}] },
        { id: "EF2", codigo: "EF2", nombre: "Espacio Flexible II", anio: 5, cuatri: 1, horas: 42, tipo: "Flexible", formato: "Electiva",
          correlativas: [], reqs: [] },

        { id: "TPA", codigo: "TPA", nombre: "Taller de Práctica Adm-Contable", anio: 5, cuatri: 2, horas: 63, tipo: "Contable", formato: "Taller",
          correlativas: ["CFA", "CO4", "IM2", "AUD"],
          reqs: [{id:"CFA", type:"R"}, {id:"CO4", type:"R"}, {id:"IM2", type:"R"}, {id:"AUD", type:"R"}] },
        { id: "EF3", codigo: "EF3", nombre: "Espacio Flexible III", anio: 5, cuatri: 2, horas: 63, tipo: "Flexible", formato: "Electiva", correlativas: [], reqs: [] },
        { id: "EF4", codigo: "EF4", nombre: "Espacio Flexible IV", anio: 5, cuatri: 2, horas: 42, tipo: "Flexible", formato: "Electiva", correlativas: [], reqs: [] },

        { id: "PPS", codigo: "PPS", nombre: "Práctica Profesional Supervisada", anio: 5, cuatri: 2, horas: 100, tipo: "Integración", formato: "Práctica",
          correlativas: ["EST","FPU","EF1","CO3","SCO","IM1","CFA","DTS"],
          reqs: [{isSpecial: true, text: "Todo 3° Año Aprobado", type: "A"}] }
      ];

      // --- RENDER ---
      let searchTerm = "";
      let filterTipo = "";
      let filterFormato = "";
      let selectedMateria = null;

      const grid = document.getElementById("mainGrid");
      const detailPanel = document.getElementById("detailPanel");
      
      const getMateria = (id) => materias.find(m => m.id === id);
      const getDependents = (id) => materias.filter(m => m.correlativas.includes(id));

      const renderGrid = () => {
        grid.innerHTML = "";
        
        const filtered = materias.filter(m => {
            const matchSearch = m.nombre.toLowerCase().includes(searchTerm.toLowerCase()) || m.codigo.includes(searchTerm.toUpperCase());
            const matchTipo = filterTipo === "" || m.tipo === filterTipo;
            const matchFormato = filterFormato === "" || (filterFormato === "Práctica" ? m.formato.includes("Práctica") : m.formato === filterFormato);
            return matchSearch && matchTipo && matchFormato;
        });

        for(let i=1; i<=5; i++) {
            const materiasAnio = filtered.filter(m => m.anio === i);
            
            const col = document.createElement("div");
            col.className = "flex-none w-[280px] bg-white rounded-2xl border border-gray-200 shadow-sm flex flex-col overflow-hidden h-full";
            
            col.innerHTML = `
                <div class="px-4 py-3 border-b border-gray-100 bg-slate-50 flex items-center justify-between flex-shrink-0">
                    <h3 class="font-black text-slate-700 text-lg">${i}° Año</h3>
                    <span class="text-xs font-bold text-slate-400 bg-white px-2 py-1 rounded border border-gray-200">${materiasAnio.length}</span>
                </div>
                <div class="p-2 space-y-2 flex-1 overflow-y-auto" id="col-content-${i}"></div>
            `;
            
            const colContent = col.querySelector(`#col-content-${i}`);
            
            [1, 2].forEach(cuatri => {
                const matsCuatri = materiasAnio.filter(m => m.cuatri === cuatri);
                if(matsCuatri.length > 0) {
                    const divider = document.createElement("div");
                    divider.className = "cuatrimestre-divider";
                    divider.innerHTML = `<span>${cuatri}° Cuatrimestre</span>`;
                    colContent.appendChild(divider);

                    matsCuatri.forEach(m => {
                        const card = document.createElement("div");
                        const isSelected = selectedMateria && selectedMateria.id === m.id;
                        const badgeClass = tipoColores[m.tipo] || tipoColores["default"];
                        const formatoClass = formatoColores[m.formato] || formatoColores["default"];
                        
                        const activeClass = isSelected ? "ring-2 ring-blue-500 shadow-md transform scale-[1.02]" : "hover:border-blue-300 hover:shadow-md";
                        const formatoDisplay = m.formato === "Práctica" ? "PPS" : m.formato;

                        card.className = `p-3 bg-white border border-gray-100 rounded-xl cursor-pointer transition-all duration-200 group ${activeClass}`;
                        
                        card.innerHTML = `
                            <div class="flex items-start justify-between gap-2 mb-1">
                                <span class="text-[9px] font-black tracking-wide uppercase px-1.5 py-0.5 rounded border ${badgeClass}">${m.tipo}</span>
                                <span class="text-[9px] text-slate-400 font-bold">${m.codigo}</span>
                            </div>
                            <h4 class="font-bold text-xs text-slate-700 leading-snug group-hover:text-blue-700 transition-colors line-clamp-2">${m.nombre}</h4>
                            <div class="mt-2 flex items-center justify-between">
                                <span class="text-[9px] px-1.5 py-0.5 rounded ${formatoClass}">${formatoDisplay}</span>
                                <span class="text-[9px] font-bold text-slate-300">${m.horas}hs</span>
                            </div>
                        `;
                        
                        card.onclick = () => openDetail(m);
                        colContent.appendChild(card);
                    });
                }
            });

            grid.appendChild(col);
        }
    };

      const openDetail = (m) => {
          selectedMateria = m;
          renderGrid();
          
          detailPanel.classList.remove("translate-y-full");
          
          const badgeClass = tipoColores[m.tipo] || tipoColores["default"];
          const fmtClass = formatoColores[m.formato] || formatoColores["default"];

          const tipoEl = document.getElementById("detailTipo");
          tipoEl.textContent = m.tipo;
          tipoEl.className = `px-2 py-0.5 rounded text-[10px] font-bold border uppercase tracking-wider ${badgeClass}`;

          const fmtBadge = document.getElementById("detailFormatoBadge");
          fmtBadge.textContent = m.formato;
          fmtBadge.className = `px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${fmtClass}`;

          document.getElementById("detailTitle").textContent = m.nombre;
          document.getElementById("detailCodigo").textContent = m.codigo;
          document.getElementById("detailInfo").textContent = `${m.anio}° Año | ${m.cuatri}° Cuatrimestre | ${m.horas} horas totales`;

          // REQUISITOS
          const reqList = document.getElementById("correlativesList");
          reqList.innerHTML = "";
          
          if(m.reqs.length === 0) {
              reqList.innerHTML = `<div class="p-3 bg-slate-50 rounded-lg border border-dashed border-slate-200 text-xs text-slate-400 text-center italic">No se requieren materias previas.</div>`;
          } else {
              m.reqs.forEach(r => {
                  const el = document.createElement("div");
                  if(r.isSpecial) {
                       el.className = "flex items-center gap-3 p-3 rounded-lg bg-red-50 text-red-800 border border-red-100";
                       el.innerHTML = `<span class="text-xs font-bold uppercase">${r.text}</span>`;
                  } else {
                      const matReq = getMateria(r.id);
                      if(matReq) {
                          el.className = "flex items-center gap-3 p-2 rounded-lg bg-white border border-gray-100 hover:border-red-200 hover:bg-red-50 cursor-pointer transition-colors group";
                          el.innerHTML = `
                             <span class="w-8 h-8 flex items-center justify-center text-[9px] font-black bg-slate-100 text-slate-500 rounded-lg group-hover:bg-white group-hover:text-red-500 transition-colors uppercase">${matReq.codigo}</span>
                             <div class="flex-1">
                                <div class="text-xs font-bold text-slate-700 group-hover:text-red-700">${matReq.nombre}</div>
                                <div class="text-[10px] font-bold text-red-400 uppercase tracking-wider mt-0.5">${r.type === 'R' ? 'Regularizada' : 'Aprobada'}</div>
                             </div>
                          `;
                          el.onclick = () => openDetail(matReq);
                      }
                  }
                  reqList.appendChild(el);
              });
          }

          // HABILITA
          const depList = document.getElementById("dependentsList");
          depList.innerHTML = "";
          const dependientes = getDependents(m.id);
          
          if(dependientes.length === 0) {
               depList.innerHTML = `<div class="p-3 bg-slate-50 rounded-lg border border-dashed border-slate-200 text-xs text-slate-400 text-center italic">No es correlativa de ninguna materia posterior.</div>`;
          } else {
              dependientes.forEach(d => {
                  const el = document.createElement("div");
                  const requirement = d.reqs.find(r => r.id === m.id);
                  const condition = requirement ? (requirement.type === 'R' ? 'Para Cursar' : 'Para Rendir') : '';

                  el.className = "flex items-center gap-3 p-2 rounded-lg bg-white border border-gray-100 hover:border-emerald-200 hover:bg-emerald-50 cursor-pointer transition-colors group";
                  el.innerHTML = `
                     <span class="w-8 h-8 flex items-center justify-center text-[9px] font-black bg-emerald-50 text-emerald-600 rounded-lg border border-emerald-100 uppercase">${d.codigo}</span>
                     <div class="flex-1">
                        <div class="text-xs font-bold text-slate-700 group-hover:text-emerald-800">${d.nombre}</div>
                        <div class="text-[10px] text-slate-400 mt-0.5">Habilita: <span class="font-bold text-emerald-600 uppercase">${condition}</span></div>
                     </div>
                  `;
                  el.onclick = () => openDetail(d);
                  depList.appendChild(el);
              });
          }
      };

      // EVENTOS
      document.getElementById("closeDetail").onclick = () => {
          detailPanel.classList.add("translate-y-full");
          selectedMateria = null;
          renderGrid();
      };
      
      document.getElementById("searchInput").addEventListener("input", (e) => {
          searchTerm = e.target.value;
          renderGrid();
      });
      
      document.getElementById("filterTipo").addEventListener("change", (e) => {
          filterTipo = e.target.value;
          renderGrid();
      });

      document.getElementById("filterFormato").addEventListener("change", (e) => {
          filterFormato = e.target.value;
          renderGrid();
      });

      document.getElementById("resetBtn").onclick = () => {
          searchTerm = "";
          filterTipo = "";
          filterFormato = "";
          document.getElementById("searchInput").value = "";
          document.getElementById("filterTipo").value = "";
          document.getElementById("filterFormato").value = "";
          renderGrid();
      };

      renderGrid();
    });
</script>

</body>
</html>
