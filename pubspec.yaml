name: correlativas_historia
description: "correlativas"
publish_to: "none"

version: 1.3.260608+749

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  url_launcher: ^6.2.5
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.5
  flutter_svg: ^2.1.0
  supabase_flutter: ^2.9.1
  video_player: ^2.9.2
  video_player_win: ^3.2.2
  device_info_plus: ^12.4.0
  crop_your_image: ^2.0.0
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.4.1
  firebase_performance: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon_fore.png
  adaptive_icon_foreground: assets/icon_fore.png
  adaptive_icon_background: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/Artes_visuales.html
    - assets/Biologia.html
    - assets/Comunicacion_social.html
    - assets/contador_publico.html
    - assets/Filosofia.html
    - assets/Fisica.html
    - assets/geografia.html
    - assets/historia.html
    - assets/Lengua_Literatura.html
    - assets/Musica.html
    - assets/politica.html
    - assets/Psicologia.html
    - assets/data/
    - assets/logo.png
    - assets/icon_fore.png
    - assets/career_icons/career_logo.png
    - assets/career_icons/logo_pscs_overlay.png
    - assets/career_icons/artes_overlay_banner.mp4
    - assets/career_icons/geografia_overlay_banner.mp4
    - assets/career_icons/historia_overlay_banner.mp4
    - assets/career_icons/logo_artes.png
    - assets/examenes_llamado1.json
    - assets/examenes_llamado2.json
    - assets/coloquios_feb_mar_2026.json
    - assets/examenes_mayo_2026.json
    - assets/coloquios_mayo_2026.json
    - assets/banners/
    - shorebird.yaml

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_24pt-Regular.ttf
          weight: 400
msix_config:
  display_name: Correlativas
  publisher_display_name: Alan Gabriel Maillet
  publisher: CN=4C9B0D11-F4BA-4831-B28A-BCFADF9CF965
  identity_name: AlanGabrielMaillet.Correlativas
  msix_version: 1.3.55.0
  logo_path: assets/icon_fore.png
  capabilities: internetClient
  store: false
  output_name: Correlativas_Local_Build
  install_certificate: true
  executable_name: correlativas_historia.exe
