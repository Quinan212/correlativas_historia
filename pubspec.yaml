name: correlativas_historia
description: "correlativas"
publish_to: "none"

version: 1.2.26+414

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  url_launcher: ^6.2.5
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon_fore.png
  adaptive_icon_foreground: assets/icon_fore.png
  adaptive_icon_background: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/Artes_visuales.html
    - assets/Biologia.html
    - assets/Comunicacion_social.html
    - assets/contador_publico.html
    - assets/Filosofia.html
    - assets/Fisica.html
    - assets/geografia.html
    - assets/historia.html
    - assets/Lengua_Literatura.html
    - assets/Musica.html
    - assets/politica.html
    - assets/Psicologia.html
    - assets/logo.png
    - assets/icon_fore.png
    - assets/examenes_llamado1.json
    - assets/examenes_llamado2.json
    - assets/coloquios_feb_mar_2026.json

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_24pt-Regular.ttf
          weight: 400